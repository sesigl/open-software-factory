{{- $ctx := dict "root" . "component" "console" }}
{{- include "osf.moduleService" $ctx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osf.name" $ctx }}
  labels:
    {{- include "osf.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "osf.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osf.labels" $ctx | nindent 8 }}
      annotations:
        checksum/factory: {{ include "osf.factoryFiles" . | sha256sum }}
    spec:
      {{- include "osf.podSecurity" . | nindent 6 }}
      {{- if .Values.improve.enabled }}
      {{- include "osf.onForemansNode" . | nindent 6 }}
      {{- end }}
      {{- if .Values.factory.repository }}
      initContainers:
        {{- include "osf.factoryClone" (dict "root" . "image" (include "osf.image" (dict "root" . "name" "console" "tag" .Values.images.console)) "volume" "factory-source" "folder" "/factory") | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "osf.image" (dict "root" . "name" "console" "tag" .Values.images.console) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: [console, serve]
          env:
            {{- include "osf.secretEnv" (dict "root" . "name" "CONSOLE_FOREMAN_TOKEN" "key" "foreman-api-token") | nindent 12 }}
            {{- include "osf.secretEnv" (dict "root" . "name" "CONSOLE_INTAKE_TOKEN" "key" "intake-api-token") | nindent 12 }}
            {{- include "osf.secretEnv" (dict "root" . "name" "CONSOLE_GATEKEEPER_TOKEN" "key" "gatekeeper-api-token") | nindent 12 }}
            - name: CONSOLE_FOREMAN_URL
              value: {{ printf "http://%s:8080" (include "osf.name" (dict "root" . "component" "foreman")) | quote }}
            - name: CONSOLE_INTAKE_URL
              value: {{ printf "http://%s:8080" (include "osf.name" (dict "root" . "component" "intake")) | quote }}
            - name: CONSOLE_GATEKEEPER_URL
              value: {{ printf "http://%s:8080" (include "osf.name" (dict "root" . "component" "gatekeeper")) | quote }}
            - name: CONSOLE_FACTORY
              value: /factory/factory.yaml
            - name: CONSOLE_GROUPS
              value: /factory/groups.json
            - name: CONSOLE_TEMPORAL_NAMESPACE
              value: {{ .Values.temporalNamespace | quote }}
            - name: CONSOLE_FORGE_ADAPTER
              value: {{ .Values.console.forgeAdapter | quote }}
            {{- with .Values.console.forgeUrl }}
            - name: CONSOLE_FORGE_URL
              value: {{ . | quote }}
            {{- end }}
            # factory-spec of the image, for /skills and the edits of a change.
            - name: CONSOLE_FACTORY_COMMAND
              value: factory
            {{- with .Values.factory.repository }}
            # Each change of the factory is a pull request on its repository (ADR 0144, ADR 0150).
            - name: CONSOLE_FACTORY_REPOSITORY
              value: {{ . | quote }}
            - name: CONSOLE_FACTORY_USER
              value: {{ required "set factory.user to the user of secrets.factoryToken, like github:acme-factory" $.Values.factory.user | quote }}
            {{- include "osf.factoryTokenEnv" (dict "root" $ "name" "CONSOLE_FACTORY_TOKEN") | nindent 12 }}
            {{- end }}
            {{- with .Values.console.temporalUrl }}
            - name: CONSOLE_TEMPORAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.improve.enabled }}
            - name: CONSOLE_IMPROVE_DIR
              value: /home/node/data
            {{- end }}
            {{- with .Values.console.links }}
            - name: CONSOLE_LINKS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.console.signIn }}
            {{- if .provider }}
            {{- /* A setting the provider misses stops the console at its start, which names it (ADR 0134). */}}
            {{- $client := ternary "CONSOLE_GITHUB" "CONSOLE_OIDC" (eq .provider "github") }}
            {{- $secret := required "set console.signIn.secret to a Secret with the keys session-secret, client-secret and signing-key" .secret }}
            - name: CONSOLE_SIGN_IN
              value: {{ .provider | quote }}
            {{- with .url }}
            - name: CONSOLE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if and .issuer (ne .provider "github") }}
            - name: CONSOLE_OIDC_ISSUER
              value: {{ .issuer | quote }}
            {{- end }}
            {{- with .clientId }}
            - name: {{ $client }}_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: CONSOLE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: session-secret
            - name: {{ $client }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: client-secret
            # The seed of the Ed25519 key that signs the proof of the person on each action, which foreman, intake and
            # gatekeeper check with the key set the console publishes (ADR 0151).
            - name: CONSOLE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: signing-key
            {{- end }}
            {{- end }}
            {{- if .Values.openbao.address }}
            # /secrets stores, lists and deletes the agents' secrets with the token that cannot read a value.
            - name: CONSOLE_SECRETS_ADAPTER
              value: secrets-openbao
            {{- include "osf.openbaoEnv" (dict "root" . "key" "console-token") | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- /* Without a session, whether the console reads its factory: a page needs a session with the sign-in on. */}}
          {{- include "osf.moduleProbe" "/v1/ready" | nindent 10 }}
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: factory-source
              mountPath: /factory
              readOnly: true
            {{- if .Values.improve.enabled }}
            - name: improve
              mountPath: /home/node/data
              readOnly: true
            {{- end }}
      volumes:
        {{- include "osf.factoryVolume" . | nindent 8 }}
        {{- if .Values.improve.enabled }}
        - name: improve
          persistentVolumeClaim:
            claimName: {{ include "osf.name" (dict "root" . "component" "improve") }}
            readOnly: true
        {{- end }}
