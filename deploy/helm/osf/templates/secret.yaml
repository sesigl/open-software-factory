{{- if not .Values.secrets.existingSecret }}
{{- $missing := "or secrets.existingSecret" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osf.secret" . }}
  labels:
    {{- include "osf.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required (printf "set secrets.postgresPassword %s" $missing) .Values.secrets.postgresPassword | quote }}
  foreman-api-token: {{ required (printf "set secrets.foremanApiToken %s" $missing) .Values.secrets.foremanApiToken | quote }}
  intake-api-token: {{ required (printf "set secrets.intakeApiToken %s" $missing) .Values.secrets.intakeApiToken | quote }}
  gatekeeper-api-token: {{ required (printf "set secrets.gatekeeperApiToken %s" $missing) .Values.secrets.gatekeeperApiToken | quote }}
  gatekeeper-slack-token: {{ required (printf "set secrets.gatekeeperSlackToken %s" $missing) .Values.secrets.gatekeeperSlackToken | quote }}
  gatekeeper-slack-signing-secret: {{ required (printf "set secrets.gatekeeperSlackSigningSecret %s" $missing) .Values.secrets.gatekeeperSlackSigningSecret | quote }}
  litellm-master-key: {{ required (printf "set secrets.litellmMasterKey %s" $missing) .Values.secrets.litellmMasterKey | quote }}
  forge-token: {{ .Values.secrets.forgeToken | quote }}
  {{- with .Values.secrets.githubToken }}
  github-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.claudeCodeOauthToken }}
  claude-code-oauth-token: {{ . | quote }}
  {{- end }}
{{- end }}
