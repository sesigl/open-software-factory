{{- /*
The LLM gateway (ADR 0080, ADR 0096): the profile's LiteLLM with its model routes from files/litellm/config.yaml, on
the database litellm. Its Service is "litellm", the address that the reference factory's inference config names, so
a namespace holds one release of the chart.
*/}}
{{- $ctx := dict "root" . "component" "litellm" }}
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    {{- include "osf.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "osf.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 4000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "osf.name" $ctx }}
  labels:
    {{- include "osf.labels" $ctx | nindent 4 }}
data:
  config.yaml: |
    {{- .Files.Get "files/litellm/config.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osf.name" $ctx }}
  labels:
    {{- include "osf.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "osf.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osf.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/litellm/config.yaml" | sha256sum }}
    spec:
      initContainers:
        {{- include "osf.databasesInit" (dict "root" . "databases" (list "litellm")) | nindent 8 }}
      containers:
        - name: litellm
          image: {{ .Values.litellm.image }}
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            {{- include "osf.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- include "osf.secretEnv" (dict "root" . "name" "LITELLM_MASTER_KEY" "key" "litellm-master-key") | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "osf.databaseUrl" (dict "root" . "database" "litellm") | quote }}
            # The model prices ship with the image; the gateway does not fetch them at start.
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 3
            failureThreshold: 3
          {{- with .Values.litellm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "osf.name" $ctx }}
