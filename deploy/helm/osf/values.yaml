# The values of the chart osf (ADR 0075). deploy/README.md#helm-values describes each one.

# Every secret of the factory. Set each value, or name a Secret with the same keys in existingSecret, for example one
# that OpenBao fills through its operator or the External Secrets Operator. The keys: postgres-password,
# foreman-api-token, intake-api-token, gatekeeper-api-token, litellm-master-key and, optional,
# gatekeeper-slack-token and gatekeeper-slack-signing-secret, forge-token, github-token and claude-code-oauth-token.
# gatekeeper asks in Slack, on the run's pull request with forgeToken, or both: set the Slack secrets, forgeToken or both.
secrets:
  existingSecret: ""
  postgresPassword: ""
  foremanApiToken: ""
  intakeApiToken: ""
  gatekeeperApiToken: ""
  gatekeeperSlackToken: ""
  gatekeeperSlackSigningSecret: ""
  # The master key of LiteLLM, like sk-<random>. foreman makes each run's own key with it.
  litellmMasterKey: ""
  # The forge token of gatekeeper, which asks on the run's pull request, and of foreman, which reads its checks.
  forgeToken: ""
  # The agents' GitHub token, GH_TOKEN in their sandboxes, and the token of `claude setup-token`. Only each sandbox's
  # egress pod gets them; the agent holds a placeholder. Without them, a stage that needs them fails.
  githubToken: ""
  claudeCodeOauthToken: ""

# The module images, published and signed by the workflow publish-images. The tags equal the pins in
# deploy/compose/compose.yaml.
images:
  registry: ghcr.io/sesigl/open-software-factory
  pullPolicy: IfNotPresent
  gatekeeper: "0.9.0"
  intake: "0.6.0"
  foreman: "0.10.0"
  console: "0.6.0"
  factorySpec: "0.8.0"
  # The image of the improvement jobs: observer, scorekit and ledger.
  observer: "0.2.0"

# The factory definition with its prompts, policy and groups, as path: content. Empty: the reference factory in
# files/factory/. foreman commits the files into Git, so a run's factory version is a commit.
factory:
  files: {}

gatekeeper:
  # The Slack channel where gatekeeper asks for decisions, like C0GATES, with the Slack secrets. With existingSecret,
  # empty turns Slack off.
  slackChannel: C0GATES
  forgeAdapter: forge-github
  resources: {}

intake:
  forgeAdapter: forge-github
  resources: {}

# The LLM gateway, with the model routes of files/litellm/config.yaml, the profile's.
litellm:
  image: ghcr.io/sesigl/open-software-factory/litellm:1.106.2-r1
  resources: {}

# The agents' sandboxes (ADR 0096). The cluster needs agent-sandbox with its extensions and a network plugin that
# enforces NetworkPolicies. foreman has rights only in their namespace.
sandboxes:
  # Empty: the release's namespace with -sandboxes.
  namespace: ""
  # false when the namespace exists, or the installer may not create namespaces.
  createNamespace: true
  # The cluster's DNS domain, for the name litellm in the sandboxes' namespace.
  clusterDomain: cluster.local

foreman:
  harnesses: '{"claude-code": "harness-claude-code run"}'
  forges: '{"github": "forge-github", "forgejo": "forge-forgejo"}'
  persistence:
    size: 1Gi
    storageClass: ""
  resources: {}

console:
  forgeAdapter: forge-github
  # The base URL of the Temporal UI, for the link to a run's history. Optional.
  temporalUrl: ""
  # The dashboards every page links, as name=url, comma-separated, like Langfuse=https://langfuse.acme.dev.
  links: ""
  resources: {}

# The improvement path (ADR 0123): a CronJob that copies foreman's run records into a claim that console's /improvement
# reads, and writes the reports of scorekit, ledger and observer. Its pod and console then run on foreman's node.
improve:
  enabled: false
  schedule: "17 * * * *"
  # The scorers that judge each run, like "redundant-tests scope-creep". Each judgment is a paid model call through
  # litellm. Empty: no scoring.
  scorers: ""
  persistence:
    size: 1Gi
    storageClass: ""
  resources: {}

# PostgreSQL with pgvector in the cluster. Set enabled to false and fill externalDatabase for a managed PostgreSQL.
postgresql:
  enabled: true
  image: pgvector/pgvector:0.8.7-pg17-trixie
  persistence:
    size: 8Gi
    storageClass: ""

# A PostgreSQL the team runs. Every pod creates its database when it is missing, so the user needs CREATEDB, or
# create the databases gatekeeper, intake, temporal and temporal_visibility yourself.
externalDatabase:
  host: ""
  port: 5432
  user: osf
  # The database psql connects to while it creates the others.
  adminDatabase: postgres

# NATS with JetStream in the cluster. Set enabled to false and externalNats.url for the team's own.
nats:
  enabled: true
  image: nats:2.11.9-alpine
  persistence:
    size: 1Gi
    storageClass: ""

externalNats:
  url: ""

# How long the stream OSF keeps an event, a dead letter too, like 7d or 12h; intake and foreman set it (ADR 0116).
natsStreamMaxAge: 7d

# Temporal on the PostgreSQL above. Set enabled to false and externalTemporal.address for the team's own.
temporal:
  enabled: true
  image: temporalio/server:1.31.4
  adminToolsImage: temporalio/admin-tools:1.31.4

externalTemporal:
  address: ""

# The namespace of the runs; foreman creates it when it is missing.
temporalNamespace: default
