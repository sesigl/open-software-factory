# Jaeger v2 as the trace store of the profile (ADR 0102): OTLP in, the traces in Badger on the volume "jaeger", and
# Jaeger's UI. Based on cmd/jaeger/config-badger.yaml of Jaeger v2.22.0.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: badger
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      badger:
        badger:
          # The volume is mounted on /tmp, which every user of the image may write.
          directories:
            keys: /tmp/jaeger/keys
            values: /tmp/jaeger/values
          ephemeral: false
          ttl:
            spans: 720h

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger
