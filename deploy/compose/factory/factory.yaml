# The reference factory of the Compose profile (ADR 0074): triage, spec, implement behind a gate, review, verify with
# evidence, ship. Copy this folder, change the prompts and the repositories, and point FACTORY_DIR at it.
version: 1
factory: reference
description: Turns a request into a reviewed, verified pull request, with a person's approval of the spec.
providers:
  harness:
    claude-code: "^2"
  # The forge that holds the repositories and the checks of the verify stage.
  forge:
    github: "^0.5"
  # The profile's LLM gateway: each run gets its own key, and the agents' models are its routes.
  inference:
    litellm: "^0"
  # The agents' secrets are variables of the foreman, OSF_SECRET_<NAME>, which only the sandbox's egress proxy gets.
  secrets:
    env: "^0"
inference:
  config: ./inference/litellm.yaml
# Each agent names its effort level (ADR 0078). A smart model (Opus, Sonnet) works at low or medium; give it high or
# more only for hard work, and say why. A small model (Haiku) works at high or more. Point routes/triage and
# routes/ship at a small model, and routes/spec, routes/implement and routes/review at a smart one.
#
# Each agent runs in a sandbox of the agents' template (ADR 0096): its own container, whose only way out is an egress
# proxy that allows the hosts below. The agent gets a placeholder for each secret; the proxy puts the real value in on
# the way to those hosts. Add the hosts that your repositories' builds need, like a registry of your own.
agents:
  triage:
    harness: claude-code
    model: routes/triage
    effort: high
    prompt: ./agents/triage.md
    secrets: &secrets [ref:env/GH_TOKEN, ref:env/CLAUDE_CODE_OAUTH_TOKEN]
    sandbox: &sandbox
      template: ghcr.io/sesigl/open-software-factory/harness-claude-code:0.6.0
      cpu: 2
      memory: 4Gi
      egress:
        - litellm
        - github.com
        - api.github.com
        - codeload.github.com
        - uploads.github.com
        - objects.githubusercontent.com
        - raw.githubusercontent.com
        - release-assets.githubusercontent.com
        - registry.npmjs.org
        - pypi.org
        - files.pythonhosted.org
        - proxy.golang.org
        - sum.golang.org
        - index.crates.io
        - static.crates.io
  spec:
    harness: claude-code
    model: routes/spec
    effort: medium
    prompt: ./agents/spec.md
    secrets: *secrets
    sandbox: *sandbox
  implement:
    harness: claude-code
    model: routes/implement
    effort: medium
    prompt: ./agents/implement.md
    secrets: *secrets
    sandbox: *sandbox
  review:
    harness: claude-code
    model: routes/review
    effort: medium
    prompt: ./agents/review.md
    secrets: *secrets
    sandbox: *sandbox
  ship:
    harness: claude-code
    model: routes/ship
    effort: high
    prompt: ./agents/ship.md
    secrets: *secrets
    sandbox: *sandbox
workflow:
  - stage: triage
  - stage: spec
  # A gate comes before its stage: a maintainer approves the spec's pull request before implement starts.
  - stage: implement
    gate:
      policy: ./policy/spec.rego
      approvers: [maintainers]
  - stage: review
  # Starts when the check "verify" of the run's pull request succeeded, and must produce evidence.
  - stage: verify
    agent: implement
    checks: [verify]
    evidence: required
  - stage: ship
