# The Compose profile of the factory: one command installs a complete factory on one machine (ADR 0074).
#   cp .env.example .env    # then set every value in it
#   docker compose up --detach --wait
# The modules come from npm at the versions below; the services are pinned images. Every port listens on OSF_HOST,
# 127.0.0.1 unless you set it.
name: osf

x-module: &module
  restart: unless-stopped
  init: true
  healthcheck:
    # A module answers its API on PORT; any answer below 500, like 401 without a token, means it is up.
    test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:8080" + process.env.OSF_HEALTH_PATH).then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))'
    interval: 2s
    timeout: 5s
    retries: 60

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: osf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: factory
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD, pg_isready, --username=osf, --dbname=factory]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-schema:
    image: temporalio/admin-tools:1.31.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        schema=/etc/temporal/schema/postgresql/v12
        for db in temporal temporal_visibility; do
          dir=$$schema/temporal/versioned
          [ "$$db" = temporal_visibility ] && dir=$$schema/visibility/versioned
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u osf --db "$$db" setup-schema -v 0.0
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u osf --db "$$db" update-schema -d "$$dir"
        done

  temporal:
    image: temporalio/server:1.31.4
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: osf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TEMPORAL_SERVER_CONFIG_FILE_PATH: /etc/temporal/osf/config.yaml
    volumes:
      - ./temporal/config.yaml:/etc/temporal/osf/config.yaml:ro
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 7233"]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.4
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: [sh, -c]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 1; done
        temporal operator namespace describe --namespace default >/dev/null 2>&1 ||
          temporal operator namespace create --namespace default --retention 30d

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - ${OSF_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 60

  nats:
    image: nats:2.11.9-alpine
    restart: unless-stopped
    command: [--jetstream, --store_dir=/data, --http_port=8222]
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    # A single node bootstraps its own Raft cluster instead of waiting for an election.
    command: [server, -s3, -dir=/data, -master.raftHashicorp, -master.raftBootstrap]
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 5s
      retries: 60

  phoenix:
    image: arizephoenix/phoenix:version-20.26.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/phoenix
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - ${OSF_HOST:-127.0.0.1}:${PHOENIX_PORT:-6006}:6006
    healthcheck:
      test: [CMD, /usr/bin/python3.13, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz')"]
      interval: 2s
      timeout: 5s
      retries: 90

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [--config, /etc/litellm/config.yaml, --port, "4000"]
    environment:
      DATABASE_URL: postgresql://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # The model prices ship with the image; the gateway does not fetch them at start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${LITELLM_PORT:-4000}:4000
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 2s
      timeout: 5s
      retries: 120

  # Copies FACTORY_DIR into the volume factory and commits it there: foreman reads a run's factory version from Git.
  factory-repo:
    image: osf/factory-spec:0.4.0
    pull_policy: build
    build: &factory-spec
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/factory-spec@0.4.0"
    volumes:
      - ${FACTORY_DIR:-./factory}:/source:ro
      - factory:/factory
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        cd /factory
        find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -R /source/. .
        [ -d .git ] || git init -q -b main
        git add -A
        git diff --cached --quiet ||
          git -c user.name=factory -c user.email=factory@localhost commit -q -m "factory from FACTORY_DIR"

  gatekeeper:
    <<: *module
    image: osf/gatekeeper:0.4.0
    pull_policy: build
    build:
      context: ../images
      target: gatekeeper
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/gatekeeper@0.4.0 @opensoftware/channel-slack@0.2.0"
    command: [gatekeeper, serve, --policy, /factory/policy/spec.rego, --groups, /factory/groups.json, --channel, "slack:${GATEKEEPER_SLACK_CHANNEL:?set GATEKEEPER_SLACK_CHANNEL in .env}"]
    depends_on:
      factory-repo:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/gates/none
      GATEKEEPER_API_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      GATEKEEPER_DATABASE_URL: postgres://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gatekeeper
      GATEKEEPER_NATS_URL: nats://nats:4222
      GATEKEEPER_SLACK_ADAPTER: channel-slack
      GATEKEEPER_SLACK_TOKEN: ${GATEKEEPER_SLACK_TOKEN:?set GATEKEEPER_SLACK_TOKEN in .env}
      GATEKEEPER_SLACK_SIGNING_SECRET: ${GATEKEEPER_SLACK_SIGNING_SECRET:?set GATEKEEPER_SLACK_SIGNING_SECRET in .env}
      GATEKEEPER_FORGE_ADAPTER: forge-github
    volumes:
      - factory:/factory:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${GATEKEEPER_PORT:-8082}:8080

  intake:
    <<: *module
    image: osf/intake:0.2.0
    pull_policy: build
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/intake@0.2.0 @opensoftware/channel-slack@0.2.0 @opensoftware/forge-github@0.5.0 @opensoftware/forge-forgejo@0.5.0"
    command: [intake, serve]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/work-items/none
      INTAKE_API_TOKEN: ${INTAKE_API_TOKEN:?set INTAKE_API_TOKEN in .env}
      INTAKE_DATABASE_URL: postgres://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/intake
      INTAKE_NATS_URL: nats://nats:4222
      INTAKE_SLACK_ADAPTER: channel-slack
      INTAKE_FORGE_ADAPTER: ${INTAKE_FORGE_ADAPTER:-forge-github}
    ports:
      - ${OSF_HOST:-127.0.0.1}:${INTAKE_PORT:-8081}:8080

  foreman:
    <<: *module
    image: osf/foreman:0.4.0
    pull_policy: build
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: >-
          @opensoftware/foreman@0.4.0 @opensoftware/harness-claude-code@0.2.0 @opensoftware/forge-github@0.5.0
          @opensoftware/forge-forgejo@0.5.0
    command: [foreman, serve]
    depends_on:
      factory-repo:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/runs
      OSF_DATA: /home/node/data
      FOREMAN_API_TOKEN: ${FOREMAN_API_TOKEN:?set FOREMAN_API_TOKEN in .env}
      FOREMAN_FACTORY: /factory/factory.yaml
      FOREMAN_TEMPORAL_ADDRESS: temporal:7233
      FOREMAN_NATS_URL: nats://nats:4222
      FOREMAN_GATEKEEPER_URL: http://gatekeeper:8080
      FOREMAN_GATEKEEPER_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      FOREMAN_HARNESSES: '{"claude-code": "harness-claude-code run"}'
      FOREMAN_FORGES: '{"github": "forge-github", "forgejo": "forge-forgejo"}'
    volumes:
      - factory:/factory:ro
      - foreman:/home/node/data
    ports:
      - ${OSF_HOST:-127.0.0.1}:${FOREMAN_PORT:-8083}:8080

  console:
    <<: *module
    image: osf/console:0.2.0
    pull_policy: build
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/console@0.2.0 @opensoftware/forge-github@0.5.0 @opensoftware/forge-forgejo@0.5.0"
    command: [console, serve]
    depends_on:
      foreman:
        condition: service_healthy
      intake:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /factory
      CONSOLE_FOREMAN_URL: http://foreman:8080
      CONSOLE_FOREMAN_TOKEN: ${FOREMAN_API_TOKEN:?set FOREMAN_API_TOKEN in .env}
      CONSOLE_INTAKE_URL: http://intake:8080
      CONSOLE_INTAKE_TOKEN: ${INTAKE_API_TOKEN:?set INTAKE_API_TOKEN in .env}
      CONSOLE_GATEKEEPER_URL: http://gatekeeper:8080
      CONSOLE_GATEKEEPER_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      CONSOLE_FACTORY: /factory/factory.yaml
      CONSOLE_FORGE_ADAPTER: forge-github
      CONSOLE_TEMPORAL_URL: http://${OSF_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}
      CONSOLE_LINKS: Phoenix=http://${OSF_HOST:-127.0.0.1}:${PHOENIX_PORT:-6006},LiteLLM=http://${OSF_HOST:-127.0.0.1}:${LITELLM_PORT:-4000}/ui
    volumes:
      - factory:/factory:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${CONSOLE_PORT:-8080}:8080

  # factory-spec on the factory in the volume, for the commands of factory: docker compose run --rm factory plan
  factory:
    image: osf/factory-spec:0.4.0
    pull_policy: build
    build: *factory-spec
    profiles: [tools]
    depends_on:
      factory-repo:
        condition: service_completed_successfully
    working_dir: /factory
    entrypoint: [factory]
    environment:
      OSF_DATA: /home/node/state
      OUTPUT: /home/node/rendered
    volumes:
      - factory:/factory
      - factory-state:/home/node/state
      - factory-rendered:/home/node/rendered

# The CA of a proxy that inspects TLS, for npm in the image builds; empty without one.
secrets:
  ca:
    file: ${OSF_BUILD_CA:-../images/no-ca.pem}

volumes:
  postgres:
  nats:
  seaweedfs:
  factory:
  factory-state:
  factory-rendered:
  foreman:
