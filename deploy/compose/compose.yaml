# The Compose profile of the factory: one command installs a complete factory on one machine (ADR 0074).
#   cp .env.example .env    # then set every value in it
#   docker compose up --detach --wait
# The module images are published to GHCR, signed, from npm at the versions below (ADR 0075); Compose builds one
# itself only when the registry does not have it. The services are pinned images. Every port listens on OSF_HOST,
# 127.0.0.1 unless you set it.
name: osf

x-module: &module
  restart: unless-stopped
  init: true
  healthcheck:
    # A module is healthy when OSF_HEALTH_PATH answers 2xx: /v1/health checks the module's own dependencies, like its
    # database and NATS, and needs no token (ADR 0086).
    test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:8080" + process.env.OSF_HEALTH_PATH).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
    interval: 2s
    timeout: 5s
    retries: 60

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: osf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: factory
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP: while init.sql runs, PostgreSQL listens only on its socket.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=osf, --dbname=factory]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-schema:
    image: temporalio/admin-tools:1.31.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        schema=/etc/temporal/schema/postgresql/v12
        for db in temporal temporal_visibility; do
          dir=$$schema/temporal/versioned
          [ "$$db" = temporal_visibility ] && dir=$$schema/visibility/versioned
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u osf --db "$$db" setup-schema -v 0.0
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u osf --db "$$db" update-schema -d "$$dir"
        done

  temporal:
    image: temporalio/server:1.31.4
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: osf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TEMPORAL_SERVER_CONFIG_FILE_PATH: /etc/temporal/osf/config.yaml
    volumes:
      - ./temporal/config.yaml:/etc/temporal/osf/config.yaml:ro
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 7233"]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.4
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: [sh, -c]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 1; done
        temporal operator namespace describe --namespace default >/dev/null 2>&1 ||
          temporal operator namespace create --namespace default --retention 30d

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - ${OSF_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 60

  nats:
    image: nats:2.11.9-alpine
    restart: unless-stopped
    command: [--jetstream, --store_dir=/data, --http_port=8222]
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  # The trace store (ADR 0100): Jaeger v2 takes the runs' spans by OTLP/HTTP and keeps them on the volume "jaeger".
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    command: [--config, /etc/jaeger/config.yaml]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      # /tmp of the image may be written by Jaeger's user, so the new volume may too.
      - jaeger:/tmp
    ports:
      - ${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686}:16686
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:13133/status]
      interval: 2s
      timeout: 5s
      retries: 60

  litellm:
    # LiteLLM with its bytecode compiled (ADR 0098), built FROM ghcr.io/berriai/litellm:v1.106.2.
    image: ghcr.io/sesigl/open-software-factory/litellm:1.106.2-r1
    build:
      context: ../images
      target: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [--config, /etc/litellm/config.yaml, --port, "4000"]
    environment:
      DATABASE_URL: postgresql://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # The model prices ship with the image; the gateway does not fetch them at start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${LITELLM_PORT:-4000}:4000
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 2s
      timeout: 5s
      retries: 120

  # Copies FACTORY_DIR into the volume factory and commits it there: foreman reads a run's factory version from Git.
  factory-repo:
    image: ghcr.io/sesigl/open-software-factory/factory-spec:0.6.1
    build: &factory-spec
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/factory-spec@0.6.1"
    volumes:
      - ${FACTORY_DIR:-./factory}:/source:ro
      - factory:/factory
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        cd /factory
        find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -R /source/. .
        [ -d .git ] || git init -q -b main
        git add -A
        git diff --cached --quiet ||
          git -c user.name=factory -c user.email=factory@localhost commit -q -m "factory from FACTORY_DIR"

  gatekeeper:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/gatekeeper:0.7.0
    build:
      context: ../images
      target: gatekeeper
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/gatekeeper@0.7.0 @opensoftware/channel-slack@0.2.3 @opensoftware/forge-github@0.5.1"
    # Asks in the Slack channel GATEKEEPER_SLACK_CHANNEL, on the run's pull request with GATEKEEPER_FORGE_TOKEN, or both.
    entrypoint: [sh, -c]
    command:
      - >-
        exec gatekeeper serve --policy /factory/policy/spec.rego --groups /factory/groups.json
        $${GATEKEEPER_SLACK_CHANNEL:+--channel slack:$$GATEKEEPER_SLACK_CHANNEL}
    depends_on:
      factory-repo:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/health
      GATEKEEPER_API_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      GATEKEEPER_DATABASE_URL: postgres://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gatekeeper
      GATEKEEPER_NATS_URL: nats://nats:4222
      GATEKEEPER_SLACK_CHANNEL: ${GATEKEEPER_SLACK_CHANNEL:-}
      GATEKEEPER_SLACK_ADAPTER: channel-slack
      GATEKEEPER_SLACK_TOKEN: ${GATEKEEPER_SLACK_TOKEN:-}
      GATEKEEPER_SLACK_SIGNING_SECRET: ${GATEKEEPER_SLACK_SIGNING_SECRET:-}
      GATEKEEPER_FORGE_ADAPTER: forge-github
      GATEKEEPER_FORGE_TOKEN: ${GATEKEEPER_FORGE_TOKEN:-}
    volumes:
      - factory:/factory:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${GATEKEEPER_PORT:-8082}:8080

  intake:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/intake:0.4.1
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/intake@0.4.1 @opensoftware/channel-slack@0.2.3 @opensoftware/forge-github@0.5.1 @opensoftware/forge-forgejo@0.5.2"
    command: [intake, serve]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/health
      INTAKE_API_TOKEN: ${INTAKE_API_TOKEN:?set INTAKE_API_TOKEN in .env}
      INTAKE_DATABASE_URL: postgres://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/intake
      INTAKE_NATS_URL: nats://nats:4222
      INTAKE_SLACK_ADAPTER: channel-slack
      INTAKE_FORGE_ADAPTER: ${INTAKE_FORGE_ADAPTER:-forge-github}
      INTAKE_WEBHOOK_SECRET: ${INTAKE_WEBHOOK_SECRET:-}
    ports:
      - ${OSF_HOST:-127.0.0.1}:${INTAKE_PORT:-8081}:8080

  # The foreman's only way to the Docker API, for the sandboxes of the agents (ADR 0096): from the foreman only, the
  # API paths that the docker sandbox adapter calls, and no bind mount. Never publish its port.
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.2
    restart: unless-stopped
    # Root without capabilities opens the host's socket, which root owns, whatever group the host gives it.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 64M
    command:
      - -listenip=0.0.0.0
      - -allowfrom=foreman
      - -allowhealthcheck
      - -watchdoginterval=60
      - -stoponwatchdog
      # A folder that does not exist: no folder of the host is the source of a bind mount. The adapter copies files.
      - -allowbindmountfrom=/osf-no-bind-mounts
      - '-allowHEAD=(/v1\.[0-9]+)?(/_ping|/containers/[^/]+/archive)'
      - '-allowGET=(/v1\.[0-9]+)?(/version|/containers/json|/containers/[^/]+/(json|logs|archive)|/exec/[^/]+/json|/networks/[^/]+|/images/.+/json)'
      - '-allowPOST=(/v1\.[0-9]+)?(/containers/create|/containers/[^/]+/(start|rename|exec)|/exec/[^/]+/start|/networks/create|/networks/[^/]+/(connect|disconnect)|/images/create|/commit)'
      - '-allowPUT=(/v1\.[0-9]+)?/containers/[^/]+/archive'
      - '-allowDELETE=(/v1\.[0-9]+)?/(containers|networks)/[^/]+'
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, ./healthcheck]
      interval: 2s
      timeout: 5s
      retries: 60

  # The template of the agents' sandboxes (ADR 0096). It only makes sure that the image is on this machine, pulled or
  # built, before the foreman starts a sandbox from it.
  agent-template:
    image: ghcr.io/sesigl/open-software-factory/harness-claude-code:0.5.1-r1
    build:
      context: ../images
      target: agent
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/harness-claude-code@0.5.1"
    entrypoint: ["true"]

  foreman:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/foreman:0.8.0
    build:
      context: ../images
      target: foreman
      secrets: [ca]
      args:
        PACKAGES: >-
          @opensoftware/foreman@0.8.0 @opensoftware/harness-claude-code@0.5.1 @opensoftware/forge-github@0.5.1
          @opensoftware/forge-forgejo@0.5.2 @opensoftware/inference-litellm@0.3.3 @opensoftware/sandbox-docker@0.3.0
          @opensoftware/sandbox-kubernetes@0.2.0
    command: [foreman, serve]
    depends_on:
      docker-proxy:
        condition: service_healthy
      agent-template:
        condition: service_completed_successfully
      factory-repo:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      litellm:
        # foreman attaches to LiteLLM in the background and is healthy only once it did (ADR 0099).
        condition: service_started
      jaeger:
        # foreman sends a span when a stage ends, and one it cannot send is a warning, not a failure (ADR 0100).
        condition: service_started
    environment:
      OSF_HEALTH_PATH: /v1/health
      OSF_DATA: /home/node/data
      # One trace per run in Jaeger, with a span per stage (ADR 0087, ADR 0100).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      FOREMAN_API_TOKEN: ${FOREMAN_API_TOKEN:?set FOREMAN_API_TOKEN in .env}
      FOREMAN_FACTORY: /factory/factory.yaml
      FOREMAN_TEMPORAL_ADDRESS: temporal:7233
      FOREMAN_NATS_URL: nats://nats:4222
      FOREMAN_GATEKEEPER_URL: http://gatekeeper:8080
      FOREMAN_GATEKEEPER_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      FOREMAN_HARNESSES: '{"claude-code": "harness-claude-code run"}'
      FOREMAN_FORGES: '{"github": "forge-github", "forgejo": "forge-forgejo"}'
      # An agent with a sandbox runs in a container of the docker sandbox adapter, through docker-proxy (ADR 0096). Its
      # egress proxy joins this project's network, so a sandbox whose egress allows litellm reaches it.
      FOREMAN_SANDBOX: docker
      FOREMAN_SANDBOXES: '{"docker": "sandbox-docker"}'
      DOCKER_HOST: tcp://docker-proxy:2375
      OSF_SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      # The secrets ref:env/GH_TOKEN and ref:env/CLAUDE_CODE_OAUTH_TOKEN of the reference factory's agents: only the
      # egress proxy of a sandbox gets them, and the agent a placeholder.
      OSF_SECRET_GH_TOKEN: ${GH_TOKEN:-}
      OSF_SECRET_CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # A token that may read pull requests and their checks, for the verify stage's check "verify". Optional.
      FOREMAN_FORGE_TOKEN: ${FOREMAN_FORGE_TOKEN:-}
      # A factory with providers.inference litellm attaches to the service litellm with its master key (ADR 0080).
      FOREMAN_INFERENCES: '{"litellm": "inference-litellm"}'
      OSF_SECRET_LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # Optional. Claude Code runs on the subscription of this token's owner, through litellm (ADR 0080).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional. The agents clone, push and open pull requests with gh and Git on github.com with this token.
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: credential.https://github.com.helper
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
      GIT_CONFIG_KEY_1: user.name
      GIT_CONFIG_VALUE_1: ${FACTORY_GIT_NAME:-factory}
      GIT_CONFIG_KEY_2: user.email
      GIT_CONFIG_VALUE_2: ${FACTORY_GIT_EMAIL:-factory@localhost}
    volumes:
      - factory:/factory:ro
      - foreman:/home/node/data
    ports:
      - ${OSF_HOST:-127.0.0.1}:${FOREMAN_PORT:-8083}:8080

  console:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/console:0.4.0
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/console@0.4.0 @opensoftware/forge-github@0.5.1 @opensoftware/forge-forgejo@0.5.2"
    command: [console, serve]
    depends_on:
      foreman:
        condition: service_healthy
      intake:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /factory
      CONSOLE_FOREMAN_URL: http://foreman:8080
      CONSOLE_FOREMAN_TOKEN: ${FOREMAN_API_TOKEN:?set FOREMAN_API_TOKEN in .env}
      CONSOLE_INTAKE_URL: http://intake:8080
      CONSOLE_INTAKE_TOKEN: ${INTAKE_API_TOKEN:?set INTAKE_API_TOKEN in .env}
      CONSOLE_GATEKEEPER_URL: http://gatekeeper:8080
      CONSOLE_GATEKEEPER_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      CONSOLE_FACTORY: /factory/factory.yaml
      CONSOLE_FORGE_ADAPTER: forge-github
      CONSOLE_TEMPORAL_URL: http://${OSF_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}
      # Each run links its trace in Jaeger.
      CONSOLE_TRACE_URL: http://${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686}/trace/{traceId}
      CONSOLE_LINKS: Jaeger=http://${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686},LiteLLM=http://${OSF_HOST:-127.0.0.1}:${LITELLM_PORT:-4000}/ui
    volumes:
      - factory:/factory:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${CONSOLE_PORT:-8080}:8080

  # factory-spec on the factory in the volume, for the commands of factory: docker compose run --rm factory plan
  factory:
    image: ghcr.io/sesigl/open-software-factory/factory-spec:0.6.1
    build: *factory-spec
    profiles: [tools]
    depends_on:
      factory-repo:
        condition: service_completed_successfully
    working_dir: /factory
    entrypoint: [factory]
    environment:
      OSF_DATA: /home/node/state
      OUTPUT: /home/node/rendered
    volumes:
      - factory:/factory
      - factory-state:/home/node/state
      - factory-rendered:/home/node/rendered

# The CA of a proxy that inspects TLS, for npm in the image builds; empty without one.
secrets:
  ca:
    file: ${OSF_BUILD_CA:-../images/no-ca.pem}

volumes:
  postgres:
  nats:
  jaeger:
  factory:
  factory-state:
  factory-rendered:
  foreman:
