# The Compose profile of the factory: one command installs a complete factory on one machine (ADR 0074).
#   cp .env.example .env    # then set every value in it
#   docker compose up --detach --wait
# The module images are published to GHCR, signed, from npm at the versions below (ADR 0075); Compose builds one
# itself only when the registry does not have it. The services are pinned images. Every port listens on OSF_HOST,
# 127.0.0.1 unless you set it.
name: osf

x-module: &module
  restart: unless-stopped
  init: true
  healthcheck:
    # A module is healthy when OSF_HEALTH_PATH answers 2xx: /v1/health checks the module's own dependencies, like its
    # database and NATS, and needs no token (ADR 0086).
    test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:8080" + process.env.OSF_HEALTH_PATH).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
    interval: 2s
    timeout: 5s
    retries: 60

# The issuer of person proofs that foreman, intake and gatekeeper check (ADR 0151): the console's key set, on only when
# the console has actions, with CONSOLE_SIGN_IN, and signs them, with CONSOLE_SIGNING_KEY. Without either the modules
# take the person a caller with their API token names, as before; a module that checks refuses an unsigned console.
x-person-keys: &person-keys ${CONSOLE_SIGN_IN:+${CONSOLE_SIGNING_KEY:+console=http://console:8080/.well-known/jwks.json}}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: osf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: factory
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP: while init.sql runs, PostgreSQL listens only on its socket.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=osf, --dbname=factory]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-schema:
    image: temporalio/admin-tools:1.31.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        schema=/etc/temporal/schema/postgresql/v12
        for db in temporal temporal_visibility; do
          dir=$$schema/temporal/versioned
          [ "$$db" = temporal_visibility ] && dir=$$schema/visibility/versioned
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u osf --db "$$db" setup-schema -v 0.0
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u osf --db "$$db" update-schema -d "$$dir"
        done

  temporal:
    image: temporalio/server:1.31.4
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: osf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TEMPORAL_SERVER_CONFIG_FILE_PATH: /etc/temporal/osf/config.yaml
    volumes:
      - ./temporal/config.yaml:/etc/temporal/osf/config.yaml:ro
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 7233"]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.4
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: [sh, -c]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 1; done
        temporal operator namespace describe --namespace default >/dev/null 2>&1 ||
          temporal operator namespace create --namespace default --retention 30d

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - ${OSF_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 60

  nats:
    image: nats:2.11.9-alpine
    restart: unless-stopped
    command: [--jetstream, --store_dir=/data, --http_port=8222]
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  # The secret store of the agents' secrets ref:openbao/<name> (ADR 0145): an admin stores a value on the console's
  # /secrets, a sandbox's egress proxy reads it. It unseals itself with OSF_OPENBAO_UNSEAL_KEY and keeps its data and
  # its audit log on the volume openbao. Never publish its port.
  openbao:
    image: quay.io/openbao/openbao:2.7.2
    restart: unless-stopped
    entrypoint: [bao]
    command: [server, -config=/openbao/config/osf.hcl]
    environment:
      OSF_OPENBAO_UNSEAL_KEY: ${OSF_OPENBAO_UNSEAL_KEY:?set OSF_OPENBAO_UNSEAL_KEY in .env}
      OSF_OPENBAO_ROOT_TOKEN: ${OSF_OPENBAO_ROOT_TOKEN:?set OSF_OPENBAO_ROOT_TOKEN in .env}
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/osf.hcl:ro
      - openbao:/openbao/file
    healthcheck:
      # 200 once the store is initialized, unsealed and active. sys/health needs no token, and OpenBao writes no
      # audit entry for it, so the check that runs every second adds nothing to the audit log.
      # -Y off: straight to the server, also where Docker gives the container a proxy (BusyBox wget skips NO_PROXY).
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1:8200/v1/sys/health]
      interval: 1s
      timeout: 5s
      retries: 60

  # One-shot: the two policies for the mount, as secrets-openbao prints them, into the volume openbao-policies.
  openbao-policies:
    image: ghcr.io/sesigl/open-software-factory/console:0.11.0
    build: &console
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: >-
          @opensoftware/console@0.11.0 @opensoftware/forge-github@0.8.1 @opensoftware/forge-forgejo@0.8.1
          @opensoftware/secrets-openbao@0.1.1 @opensoftware/factory-spec@0.12.1
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        secrets-openbao policy write > /home/node/data/osf-console.hcl
        secrets-openbao policy read > /home/node/data/osf-egress.hcl
    environment:
      OSF_OPENBAO_MOUNT: ${OSF_OPENBAO_MOUNT:-secret}
    volumes:
      # A folder of the image's user, so the new volume is the user's too.
      - openbao-policies:/home/node/data

  # One-shot at every start: the mount, the two policies, and the tokens with the IDs of .env, each made new for
  # 768 hours, OpenBao's maximum: the console's (writes, cannot read a value) and the egress proxy's (only reads).
  openbao-setup:
    image: quay.io/openbao/openbao:2.7.2
    depends_on:
      openbao:
        condition: service_healthy
      openbao-policies:
        condition: service_completed_successfully
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        # The first start sets the root token up a moment after the store answers: wait for it, at most 30 s.
        tries=0
        until bao token lookup >/dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 30 ]; then
            echo "openbao-setup: the root token OSF_OPENBAO_ROOT_TOKEN of .env does not answer at $$BAO_ADDR after 30 s;" >&2
            echo "  a volume openbao set up with another .env needs that .env's root token" >&2
            exit 1
          fi
          sleep 1
        done
        bao policy write osf-console /policies/osf-console.hcl
        bao policy write osf-egress /policies/osf-egress.hcl
        bao secrets list -format=json | grep -q "\"$$MOUNT/\"" || bao secrets enable -path="$$MOUNT" -version=2 kv
        token() {
          bao token revoke "$$2" >/dev/null
          # Prints only how long the token lives, never its ID; OpenBao's warning about a token with a chosen ID is
          # in ADR 0145.
          lives=$$(bao token create -id="$$2" -policy="$$1" -orphan -ttl=768h -display-name="$$1" -field=token_duration 2>/dev/null)
          echo "$$1: a new token for $$lives seconds"
        }
        token osf-console "$$CONSOLE_TOKEN"
        token osf-egress "$$EGRESS_TOKEN"
    environment:
      BAO_ADDR: http://openbao:8200
      # Straight to openbao, also on a host whose Docker gives containers a proxy.
      NO_PROXY: openbao
      BAO_TOKEN: ${OSF_OPENBAO_ROOT_TOKEN:?set OSF_OPENBAO_ROOT_TOKEN in .env}
      MOUNT: ${OSF_OPENBAO_MOUNT:-secret}
      CONSOLE_TOKEN: ${OSF_OPENBAO_CONSOLE_TOKEN:?set OSF_OPENBAO_CONSOLE_TOKEN in .env}
      EGRESS_TOKEN: ${OSF_OPENBAO_EGRESS_TOKEN:?set OSF_OPENBAO_EGRESS_TOKEN in .env}
    volumes:
      - openbao-policies:/policies:ro

  # The trace store (ADR 0100): Jaeger v2 takes the runs' spans by OTLP/HTTP and keeps them on the volume "jaeger".
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    command: [--config, /etc/jaeger/config.yaml]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      # /tmp of the image may be written by Jaeger's user, so the new volume may too.
      - jaeger:/tmp
    ports:
      - ${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686}:16686
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:13133/status]
      interval: 2s
      timeout: 5s
      retries: 60

  litellm:
    # LiteLLM with its bytecode compiled (ADR 0098), built FROM ghcr.io/berriai/litellm:v1.106.2.
    image: ghcr.io/sesigl/open-software-factory/litellm:1.106.2-r1
    build:
      context: ../images
      target: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [--config, /etc/litellm/config.yaml, --port, "4000"]
    environment:
      DATABASE_URL: postgresql://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # The model prices ship with the image; the gateway does not fetch them at start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${LITELLM_PORT:-4000}:4000
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 2s
      timeout: 5s
      retries: 120

  # One-shot at every start: the factory in the volume factory, which gatekeeper, the console and the tools read. With
  # FACTORY_REPOSITORY a clone of its branch's newest commit, with FACTORY_TOKEN; without it FACTORY_DIR, committed
  # there, as foreman reads a run's factory version from Git (ADR 0150).
  factory-repo:
    image: ghcr.io/sesigl/open-software-factory/factory-spec:0.12.1
    build: &factory-spec
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/factory-spec@0.12.1"
    environment:
      FACTORY_REPOSITORY: ${FACTORY_REPOSITORY:-}
      FACTORY_TOKEN: ${FACTORY_TOKEN:-}
    volumes:
      - ${FACTORY_DIR:-./factory}:/source:ro
      - ./factory-repo/factory-repo.sh:/osf/factory-repo.sh:ro
      - factory:/factory
    entrypoint: [sh, /osf/factory-repo.sh]
    command: [/factory, /source]

  gatekeeper:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/gatekeeper:0.10.1
    build:
      context: ../images
      target: gatekeeper
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/gatekeeper@0.10.1 @opensoftware/channel-slack@0.3.0 @opensoftware/forge-github@0.8.1"
    # Asks in the Slack channel GATEKEEPER_SLACK_CHANNEL, on the run's pull request with GATEKEEPER_FORGE_TOKEN, or both.
    entrypoint: [sh, -c]
    command:
      - >-
        exec gatekeeper serve --policy /factory/policy/spec.rego --groups /factory/groups.json
        $${GATEKEEPER_SLACK_CHANNEL:+--channel slack:$$GATEKEEPER_SLACK_CHANNEL}
    depends_on:
      factory-repo:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/health
      GATEKEEPER_API_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      GATEKEEPER_DATABASE_URL: postgres://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gatekeeper
      GATEKEEPER_NATS_URL: nats://nats:4222
      GATEKEEPER_SLACK_CHANNEL: ${GATEKEEPER_SLACK_CHANNEL:-}
      GATEKEEPER_SLACK_ADAPTER: channel-slack
      GATEKEEPER_SLACK_TOKEN: ${GATEKEEPER_SLACK_TOKEN:-}
      GATEKEEPER_SLACK_SIGNING_SECRET: ${GATEKEEPER_SLACK_SIGNING_SECRET:-}
      GATEKEEPER_FORGE_ADAPTER: forge-github
      GATEKEEPER_FORGE_TOKEN: ${GATEKEEPER_FORGE_TOKEN:-}
      GATEKEEPER_PERSON_KEYS: *person-keys
    volumes:
      - factory:/factory:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${GATEKEEPER_PORT:-8082}:8080

  intake:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/intake:0.7.1
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/intake@0.7.1 @opensoftware/channel-slack@0.3.0 @opensoftware/forge-github@0.8.1 @opensoftware/forge-forgejo@0.8.1"
    command: [intake, serve]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OSF_HEALTH_PATH: /v1/health
      INTAKE_API_TOKEN: ${INTAKE_API_TOKEN:?set INTAKE_API_TOKEN in .env}
      INTAKE_DATABASE_URL: postgres://osf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/intake
      INTAKE_NATS_URL: nats://nats:4222
      # The stream OSF keeps an event, a dead letter too, 7 days (ADR 0116).
      OSF_STREAM_MAX_AGE: ${OSF_STREAM_MAX_AGE:-7d}
      INTAKE_SLACK_ADAPTER: channel-slack
      INTAKE_FORGE_ADAPTER: ${INTAKE_FORGE_ADAPTER:-forge-github}
      INTAKE_WEBHOOK_SECRET: ${INTAKE_WEBHOOK_SECRET:-}
      INTAKE_PERSON_KEYS: *person-keys
    ports:
      - ${OSF_HOST:-127.0.0.1}:${INTAKE_PORT:-8081}:8080

  # The foreman's only way to the Docker API, for the sandboxes of the agents (ADR 0096): from the foreman only, the
  # API paths that the docker sandbox adapter calls, and no bind mount. Never publish its port.
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.2
    restart: unless-stopped
    # Root without capabilities opens the host's socket, which root owns, whatever group the host gives it.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 64M
    command:
      - -listenip=0.0.0.0
      - -allowfrom=foreman
      - -allowhealthcheck
      - -watchdoginterval=60
      - -stoponwatchdog
      # A folder that does not exist: no folder of the host is the source of a bind mount. The adapter copies files.
      - -allowbindmountfrom=/osf-no-bind-mounts
      - '-allowHEAD=(/v1\.[0-9]+)?(/_ping|/containers/[^/]+/archive)'
      - '-allowGET=(/v1\.[0-9]+)?(/version|/containers/json|/containers/[^/]+/(json|logs|archive)|/exec/[^/]+/json|/networks/[^/]+|/images/.+/json)'
      - '-allowPOST=(/v1\.[0-9]+)?(/containers/create|/containers/[^/]+/(start|rename|exec)|/exec/[^/]+/start|/networks/create|/networks/[^/]+/(connect|disconnect)|/images/create|/commit)'
      - '-allowPUT=(/v1\.[0-9]+)?/containers/[^/]+/archive'
      - '-allowDELETE=(/v1\.[0-9]+)?/(containers|networks)/[^/]+'
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, ./healthcheck]
      interval: 2s
      timeout: 5s
      retries: 60

  # The template of the agents' sandboxes (ADR 0096). It only makes sure that the image is on this machine, pulled or
  # built, before the foreman starts a sandbox from it.
  agent-template:
    image: ghcr.io/sesigl/open-software-factory/harness-claude-code:0.6.0
    build:
      context: ../images
      target: agent
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/harness-claude-code@0.6.0"
    entrypoint: ["true"]

  foreman:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/foreman:0.14.1
    build:
      context: ../images
      target: foreman
      secrets: [ca]
      args:
        PACKAGES: >-
          @opensoftware/foreman@0.14.1 @opensoftware/harness-claude-code@0.6.0 @opensoftware/forge-github@0.8.1
          @opensoftware/forge-forgejo@0.8.1 @opensoftware/inference-litellm@0.5.1 @opensoftware/sandbox-docker@0.8.0
          @opensoftware/sandbox-kubernetes@0.6.0 @opensoftware/secrets-openbao@0.1.1
    command: [foreman, serve]
    depends_on:
      openbao-setup:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_healthy
      agent-template:
        condition: service_completed_successfully
      factory-repo:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      litellm:
        # foreman attaches to LiteLLM in the background and is healthy only once it did (ADR 0099).
        condition: service_started
      jaeger:
        # foreman sends a span when a stage ends, and one it cannot send is a warning, not a failure (ADR 0100).
        condition: service_started
    environment:
      OSF_HEALTH_PATH: /v1/health
      OSF_DATA: /home/node/data
      # One trace per run in Jaeger, with a span per stage (ADR 0087, ADR 0100).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      FOREMAN_API_TOKEN: ${FOREMAN_API_TOKEN:?set FOREMAN_API_TOKEN in .env}
      FOREMAN_PERSON_KEYS: *person-keys
      # The factory's repository on a forge, fetched at each run with FACTORY_TOKEN, or the commit of the volume
      # factory (ADR 0124, ADR 0150).
      FOREMAN_FACTORY: ${FACTORY_REPOSITORY:-/factory/factory.yaml}
      FOREMAN_FACTORY_TOKEN: ${FACTORY_TOKEN:-}
      FOREMAN_TEMPORAL_ADDRESS: temporal:7233
      FOREMAN_NATS_URL: nats://nats:4222
      # The stream OSF keeps an event, a dead letter too, 7 days (ADR 0116).
      OSF_STREAM_MAX_AGE: ${OSF_STREAM_MAX_AGE:-7d}
      FOREMAN_GATEKEEPER_URL: http://gatekeeper:8080
      FOREMAN_GATEKEEPER_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      FOREMAN_HARNESSES: '{"claude-code": "harness-claude-code run"}'
      FOREMAN_FORGES: '{"github": "forge-github", "forgejo": "forge-forgejo"}'
      # An agent with a sandbox runs in a container of the docker sandbox adapter, through docker-proxy (ADR 0096). Its
      # egress proxy joins this project's network, so a sandbox whose egress allows litellm reaches it.
      FOREMAN_SANDBOX: docker
      FOREMAN_SANDBOXES: '{"docker": "sandbox-docker"}'
      DOCKER_HOST: tcp://docker-proxy:2375
      OSF_SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      # The secrets ref:env/GH_TOKEN and ref:env/CLAUDE_CODE_OAUTH_TOKEN of the reference factory's agents: only the
      # egress proxy of a sandbox gets them, and the agent a placeholder.
      OSF_SECRET_GH_TOKEN: ${GH_TOKEN:-}
      OSF_SECRET_CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The secrets ref:openbao/<name> that an admin stores on the console's /secrets (ADR 0145). Before a stage the
      # foreman asks secrets-openbao whether each has a value (ADR 0139); a sandbox's egress proxy, on this project's
      # network, reads it from openbao with the token that only reads.
      FOREMAN_SECRETS: '{"openbao": "secrets-openbao"}'
      OSF_OPENBAO_ADDR: http://openbao:8200
      OSF_OPENBAO_MOUNT: ${OSF_OPENBAO_MOUNT:-secret}
      OSF_OPENBAO_TOKEN: ${OSF_OPENBAO_EGRESS_TOKEN:?set OSF_OPENBAO_EGRESS_TOKEN in .env}
      # A token that may read pull requests and their checks, for the verify stage's check "verify". Optional.
      FOREMAN_FORGE_TOKEN: ${FOREMAN_FORGE_TOKEN:-}
      # A factory with providers.inference litellm attaches to the service litellm with its master key (ADR 0080).
      FOREMAN_INFERENCES: '{"litellm": "inference-litellm"}'
      OSF_SECRET_LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # Optional. Claude Code runs on the subscription of this token's owner, through litellm (ADR 0080).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional. The agents clone, push and open pull requests with gh and Git on github.com with this token.
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: credential.https://github.com.helper
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
      GIT_CONFIG_KEY_1: user.name
      GIT_CONFIG_VALUE_1: ${FACTORY_GIT_NAME:-factory}
      GIT_CONFIG_KEY_2: user.email
      GIT_CONFIG_VALUE_2: ${FACTORY_GIT_EMAIL:-factory@localhost}
    volumes:
      - factory:/factory:ro
      - foreman:/home/node/data
    ports:
      - ${OSF_HOST:-127.0.0.1}:${FOREMAN_PORT:-8083}:8080

  console:
    <<: *module
    image: ghcr.io/sesigl/open-software-factory/console:0.11.0
    build: *console
    command: [console, serve]
    depends_on:
      openbao-setup:
        condition: service_completed_successfully
      foreman:
        condition: service_healthy
      intake:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
    environment:
      # Without a session, whether the console reads its factory: a page needs a session with the sign-in on.
      OSF_HEALTH_PATH: /v1/ready
      CONSOLE_FOREMAN_URL: http://foreman:8080
      CONSOLE_FOREMAN_TOKEN: ${FOREMAN_API_TOKEN:?set FOREMAN_API_TOKEN in .env}
      CONSOLE_INTAKE_URL: http://intake:8080
      CONSOLE_INTAKE_TOKEN: ${INTAKE_API_TOKEN:?set INTAKE_API_TOKEN in .env}
      CONSOLE_GATEKEEPER_URL: http://gatekeeper:8080
      CONSOLE_GATEKEEPER_TOKEN: ${GATEKEEPER_API_TOKEN:?set GATEKEEPER_API_TOKEN in .env}
      CONSOLE_FACTORY: /factory/factory.yaml
      CONSOLE_GROUPS: /factory/groups.json
      # factory-spec of the image, for /skills and the edits of a change.
      CONSOLE_FACTORY_COMMAND: factory
      # With FACTORY_REPOSITORY, the console proposes each change of the factory as a pull request on it, with the
      # token FACTORY_TOKEN of FACTORY_USER, and fetches its newest commit at each change (ADR 0144, ADR 0150).
      CONSOLE_FACTORY_REPOSITORY: ${FACTORY_REPOSITORY:-}
      CONSOLE_FACTORY_TOKEN: ${FACTORY_TOKEN:-}
      CONSOLE_FACTORY_USER: ${FACTORY_USER:-}
      CONSOLE_FORGE_ADAPTER: ${FACTORY_FORGE_ADAPTER:-forge-github}
      CONSOLE_FORGE_URL: ${FACTORY_FORGE_URL:-}
      CONSOLE_TEMPORAL_URL: http://${OSF_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}
      # Each run links its trace in Jaeger.
      CONSOLE_TRACE_URL: http://${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686}/trace/{traceId}
      # Each stage links its span in that trace (ADR 0121).
      CONSOLE_SPAN_URL: http://${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686}/trace/{traceId}?uiFind={spanId}
      # console doctor --deep sends one span to Jaeger's OTLP receiver and finds it with Jaeger's query API (ADR 0120).
      CONSOLE_OTLP_URL: http://jaeger:4318
      CONSOLE_TRACES_URL: http://jaeger:16686
      # The run records and scores of the service improve; empty without the profile improve.
      CONSOLE_IMPROVE_DIR: /home/node/data
      CONSOLE_LINKS: Jaeger=http://${OSF_HOST:-127.0.0.1}:${JAEGER_PORT:-16686},LiteLLM=http://${OSF_HOST:-127.0.0.1}:${LITELLM_PORT:-4000}/ui
      # The console's own sign-in (ADR 0134), off unless CONSOLE_SIGN_IN names the provider: oidc or github. With it
      # on, the console does not start without that provider's settings and CONSOLE_SESSION_SECRET, and only the
      # people of the factory's access.yaml sign in. The console runs on localhost, the tools above on OSF_HOST.
      CONSOLE_SIGN_IN: ${CONSOLE_SIGN_IN:-}
      CONSOLE_URL: ${CONSOLE_URL:-http://localhost:${CONSOLE_PORT:-8080}}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:-}
      CONSOLE_OIDC_ISSUER: ${CONSOLE_OIDC_ISSUER:-}
      CONSOLE_OIDC_CLIENT_ID: ${CONSOLE_OIDC_CLIENT_ID:-}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:-}
      CONSOLE_GITHUB_CLIENT_ID: ${CONSOLE_GITHUB_CLIENT_ID:-}
      CONSOLE_GITHUB_CLIENT_SECRET: ${CONSOLE_GITHUB_CLIENT_SECRET:-}
      # The seed of the Ed25519 key that signs the proof of the person on each action, and whose public key the console
      # publishes at /.well-known/jwks.json for the modules (ADR 0151).
      CONSOLE_SIGNING_KEY: ${CONSOLE_SIGNING_KEY:-}
      # /secrets, for an admin with the sign-in on: the console stores, lists and deletes the agents' secrets in
      # openbao with its own token, which cannot read a value (ADR 0137, ADR 0145).
      CONSOLE_SECRETS_ADAPTER: secrets-openbao
      OSF_OPENBAO_ADDR: http://openbao:8200
      OSF_OPENBAO_MOUNT: ${OSF_OPENBAO_MOUNT:-secret}
      OSF_OPENBAO_TOKEN: ${OSF_OPENBAO_CONSOLE_TOKEN:?set OSF_OPENBAO_CONSOLE_TOKEN in .env}
    volumes:
      - factory:/factory:ro
      - improve:/home/node/data:ro
    ports:
      - ${OSF_HOST:-127.0.0.1}:${CONSOLE_PORT:-8080}:8080

  # The improvement path (ADR 0123), behind the profile improve: docker compose --profile improve up --detach.
  # Every IMPROVE_INTERVAL seconds (3600; 0 runs once) it copies the run record of each stage that the foreman exported into the
  # volume improve, which the console's /improvement reads, and writes the reports of scorekit, ledger and observer into
  # its folder reports, which the console skips, as they hold no record. Judging runs is a paid model call: scorekit
  # scores only with IMPROVE_SCORERS set, like "redundant-tests scope-creep", through litellm.
  improve:
    image: ghcr.io/sesigl/open-software-factory/observer:0.2.1
    build:
      context: ../images
      target: module
      secrets: [ca]
      args:
        PACKAGES: "@opensoftware/observer@0.2.1 @opensoftware/scorekit@0.6.1 @opensoftware/ledger@0.8.0"
    profiles: [improve]
    restart: unless-stopped
    init: true
    environment:
      IMPROVE_INTERVAL: ${IMPROVE_INTERVAL:-3600}
      IMPROVE_SCORERS: ${IMPROVE_SCORERS:-}
      SCOREKIT_INFERENCE_URL: http://litellm:4000/v1
      SCOREKIT_INFERENCE_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    volumes:
      - foreman:/home/node/rendered:ro
      - improve:/home/node/data
    entrypoint: [sh, -c]
    command:
      - |
        set -u
        records=/home/node/data reports=/home/node/data/reports
        mkdir -p "$$records/runs" "$$records/scores" "$$reports"
        while :; do
          for record in /home/node/rendered/transcripts/*/run-record.json; do
            [ -f "$$record" ] || continue
            cp "$$record" "$$records/runs/$$(basename "$$(dirname "$$record")").json"
          done
          for scorer in $$IMPROVE_SCORERS; do
            scorekit score --scorer "$$scorer" --out "$$records/scores/scores.jsonl" "$$records/runs"
          done
          [ ! -f "$$records/scores/scores.jsonl" ] ||
            scorekit report --out "$$reports/scores.json" "$$records/scores/scores.jsonl"
          ledger report --db "$$reports/ledger.duckdb" --out "$$reports/ledger.json" "$$records/runs"
          observer analyze --runs "$$records/runs" --out "$$reports/problems.json" "$$records/scores"
          [ "$$IMPROVE_INTERVAL" != 0 ] || break
          sleep "$$IMPROVE_INTERVAL"
        done

  # factory-spec on the factory in the volume, for the commands of factory: docker compose run --rm factory plan
  factory:
    image: ghcr.io/sesigl/open-software-factory/factory-spec:0.12.1
    build: *factory-spec
    profiles: [tools]
    depends_on:
      factory-repo:
        condition: service_completed_successfully
    working_dir: /factory
    entrypoint: [factory]
    environment:
      OSF_DATA: /home/node/state
      OUTPUT: /home/node/rendered
    volumes:
      - factory:/factory
      - factory-state:/home/node/state
      - factory-rendered:/home/node/rendered

# The CA of a proxy that inspects TLS, for npm in the image builds; empty without one.
secrets:
  ca:
    file: ${OSF_BUILD_CA:-../images/no-ca.pem}

volumes:
  postgres:
  nats:
  jaeger:
  factory:
  factory-state:
  factory-rendered:
  improve:
  foreman:
  # OpenBao's data and audit log. Back it up together with OSF_OPENBAO_UNSEAL_KEY: neither is any use without the other.
  openbao:
  openbao-policies:
