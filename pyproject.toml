[project]
name = "osf-workspace"
version = "0.0.0"
description = "uv workspace root of the Open Software Factory. Python modules live in modules/*."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["modules/*", "packages/*"]
exclude = ["modules/_template", "packages/testkit"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["tools", "modules", "packages"]
exclude = ["**/node_modules", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
