# The factory of the paid reference run (ADR 0128): the reference factory's implement stage alone, on opencode, with
# the profile's LiteLLM as the model gateway and a budget of 0.50 USD for the whole run. run.sh starts it.
version: 1
factory: paid-reference
description: Implements one issue of the sample repository in a Forgejo of the job, with a paid model.
providers:
  harness:
    opencode: "^0"
  inference:
    litellm: "^0"
inference:
  config: ./inference/litellm.yaml
  budget: 0.5
agents:
  implement:
    harness: opencode
    model: routes/implement
    effort: medium
    prompt: ./agents/implement.md
workflow:
  - stage: implement
