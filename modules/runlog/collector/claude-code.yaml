# OpenTelemetry Collector config for Claude Code (runlog, ADR 0025). Start Claude Code with
# CLAUDE_CODE_ENABLE_TELEMETRY=1, CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1, OTEL_TRACES_EXPORTER=otlp and
# OTEL_EXPORTER_OTLP_ENDPOINT pointing at this Collector. Set OTEL_EXPORTER_OTLP_ENDPOINT of the Collector to the
# trace store. The spans come out with the names "runlog export" writes: invoke_agent, chat, execute_tool.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  # Prompt and tool content stays out of the run. Remove this processor from the pipeline to keep it.
  transform/content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "user_prompt")
  transform/claude-code:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["osf.harness.name"], "claude-code") where attributes["osf.harness.name"] == nil
      - context: span
        statements:
          - set(attributes["gen_ai.conversation.id"], attributes["session.id"]) where attributes["session.id"] != nil
          - set(attributes["gen_ai.operation.name"], "invoke_agent") where name == "claude_code.interaction"
          - set(attributes["gen_ai.provider.name"], "anthropic") where name == "claude_code.interaction"
          - set(name, "invoke_agent") where name == "claude_code.interaction"
          - set(attributes["gen_ai.operation.name"], "chat") where name == "claude_code.llm_request"
          - set(attributes["gen_ai.provider.name"], "anthropic") where name == "claude_code.llm_request"
          - set(attributes["gen_ai.request.model"], attributes["model"]) where name == "claude_code.llm_request" and attributes["model"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where name == "claude_code.llm_request" and attributes["input_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where name == "claude_code.llm_request" and attributes["output_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_read.input_tokens"], attributes["cache_read_tokens"]) where name == "claude_code.llm_request" and attributes["cache_read_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_write.input_tokens"], attributes["cache_creation_tokens"]) where name == "claude_code.llm_request" and attributes["cache_creation_tokens"] != nil
          - set(name, Concat(["chat", attributes["gen_ai.request.model"]], " ")) where name == "claude_code.llm_request" and attributes["gen_ai.request.model"] != nil
          - set(name, "chat") where name == "claude_code.llm_request"
          - set(attributes["gen_ai.operation.name"], "execute_tool") where name == "claude_code.tool"
          - set(attributes["gen_ai.tool.name"], attributes["tool_name"]) where name == "claude_code.tool" and attributes["tool_name"] != nil
          - set(name, Concat(["execute_tool", attributes["tool_name"]], " ")) where name == "claude_code.tool" and attributes["tool_name"] != nil
          - set(name, "execute_tool") where name == "claude_code.tool"
exporters:
  otlphttp:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    encoding: json
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/content, transform/claude-code]
      exporters: [otlphttp]
