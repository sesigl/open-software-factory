# A kind cluster with agent-sandbox v1.0.8 for the system tests of adapters/sandbox/kubernetes (ADR 0055). kindnet
# enforces the sandboxes' NetworkPolicies. The test images are pulled into the node while the cluster settles. The
# tests find the cluster through KUBECONFIG, and the runner, where the testkit's fakes listen, as host.docker.internal.
# kind and the agent-sandbox manifest come from .tools/bin, which make install pins and CI caches. When an earlier step
# started the cluster in the background (kind-start.sh start, ADR 0163), it waits for that cluster, whose start also
# applied the manifest and waited for the controller; otherwise kind-start.sh does both now (ADR 0167).
name: kind with agent-sandbox
description: Starts kind with agent-sandbox and sets KUBECONFIG and OSF_SANDBOX_HOST_ALIASES for the next steps.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
        "$GITHUB_ACTION_PATH/../../scripts/kind-start.sh" wait agent-sandbox
        egress=$(node -e 'import("./packages/sandbox-egress/src/domain/egress-proxy.ts").then(({ EGRESS_PROXY }) =>
          console.log(EGRESS_PROXY.image))')
        test -n "$egress"
        for image in "$egress" $(grep -ho '"[a-z/-]*:[0-9a-z.]*@sha256:[0-9a-f]*"' adapters/sandbox/kubernetes/system-tests/sandbox.ts | tr -d '"'); do
          nohup docker exec kind-control-plane crictl pull "$image" >/dev/null 2>&1 &
        done
        gateway=$(docker network inspect kind --format '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -m1 '\.')
        echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
        echo "OSF_SANDBOX_HOST_ALIASES=host.docker.internal=$gateway" >> "$GITHUB_ENV"
