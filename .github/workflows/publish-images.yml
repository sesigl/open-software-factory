# Publishes the module images of deploy/compose/compose.yaml and the Helm chart deploy/helm/osf to GHCR, signed, with
# SBOMs and SLSA provenance (ADR 0075). A tag that GHCR already has is never built again. The one-time setup is in
# deploy/README.md#releases.
name: publish-images

on:
  push:
    branches: [main]
    paths:
      - deploy/compose/compose.yaml
      - deploy/images/**
      - deploy/helm/osf/**
      - .github/workflows/publish-images.yml
  # Publishes what is missing again, for example after a failed push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io/sesigl/open-software-factory
      id-token: write # keyless signatures with cosign
    env:
      REGISTRY: ghcr.io/sesigl/open-software-factory
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # cosign-installer downloads without a retry, and that download failed in two of three runs on 9 November 2026:
      # the pinned release, with retries, checked against its pinned SHA-256.
      - name: Install cosign
        env:
          VERSION: v2.6.1
          SHA256: 064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$VERSION/cosign-linux-amd64"
          echo "$SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      # compose.yaml refuses to load without its secrets; building needs none of them.
      - name: The targets of compose.yaml that GHCR does not have
        id: targets
        working-directory: deploy/compose
        run: |
          grep -o '\${[A-Z_]*:?' compose.yaml | sort -u | sed 's/^\${\(.*\):?$/\1=unused/' > .env
          targets=""
          while read -r target image; do
            case "$image" in "$REGISTRY"/*) ;; *) continue ;; esac
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "$image is published"
            else
              targets="$targets $target"
            fi
          done < <(docker buildx bake --file compose.yaml --print 2>/dev/null |
            jq -r '.target | to_entries[] | select(.key != "factory-repo") | "\(.key) \(.value.tags[0])"')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      # A release pull request moves the pins and the npm versions together (ADR 0095), and publish-<name> runs at the
      # same time as this workflow: wait until npm can install each package that an image installs, with its
      # dependencies. A dependency that no pin names, like @opensoftware/sandbox-egress of the sandbox adapters, can be
      # published after the pinned packages, so the step tries the install itself, as the image build does.
      - name: Wait for the packages of the images on npm
        if: steps.targets.outputs.targets != ''
        timeout-minutes: 30
        run: |
          pins=$(grep -o '@opensoftware/[a-z0-9-]*@[0-9][0-9.]*' deploy/compose/compose.yaml | sort -u)
          mkdir -p "$RUNNER_TEMP/npm-check/lib"
          for pin in $pins; do
            # shellcheck disable=SC2086
            until npm install --dry-run --global --prefer-online --no-fund --no-audit --registry https://registry.npmjs.org \
              --prefix "$RUNNER_TEMP/npm-check" "$pin" >/dev/null 2>"$RUNNER_TEMP/npm-check.log"; do
              echo "waiting for $pin and its dependencies on npm: $(grep -m1 'notarget\|ETARGET\|E404' "$RUNNER_TEMP/npm-check.log")"
              sleep 20
            done
            # npm answers a new version's metadata minutes before its tarball (run 43581450016): the build downloads it.
            tarball=$(npm view --registry https://registry.npmjs.org "$pin" dist.tarball)
            until curl -fsI -o /dev/null "$tarball"; do
              echo "waiting for the tarball of $pin on npm"
              sleep 20
            done
          done

      - name: Build and push the images for amd64 and arm64, with SBOM and provenance
        if: steps.targets.outputs.targets != ''
        working-directory: deploy/compose
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          # shellcheck disable=SC2086
          # The images' build context and the CA secret are in ../images.
          docker buildx bake --allow=fs.read=../images --file compose.yaml $TARGETS --push \
            --set '*.platform=linux/amd64,linux/arm64' \
            --set '*.attest=type=sbom' \
            --set '*.attest=type=provenance,mode=max' \
            --metadata-file "$RUNNER_TEMP/bake.json"

      - name: Sign the images
        if: steps.targets.outputs.targets != ''
        run: |
          jq -r 'to_entries[] | "\(.value."image.name" | split(",")[0])@\(.value."containerimage.digest")"' \
            "$RUNNER_TEMP/bake.json" | sort -u | while read -r image; do
            cosign sign --yes "${image%%:*}@${image##*@}"
          done

      - name: Push and sign the chart
        run: |
          version=$(sed -n 's/^version: *//p' deploy/helm/osf/Chart.yaml)
          if helm show chart "oci://$REGISTRY/charts/osf" --version "$version" >/dev/null 2>&1; then
            echo "osf $version is published"
            exit 0
          fi
          helm package deploy/helm/osf --destination "$RUNNER_TEMP/chart"
          # GHCR sometimes answers the tag of a manifest it just took with "not found" (run 43576804028): try again,
          # and fail here, not at cosign, when no push printed a digest.
          set -o pipefail
          for attempt in 1 2 3; do
            helm push "$RUNNER_TEMP/chart/osf-$version.tgz" "oci://$REGISTRY/charts" 2>&1 | tee "$RUNNER_TEMP/push.log" && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          digest=$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/push.log")
          [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          cosign sign --yes "$REGISTRY/charts/osf@$digest"
