# Slow checks that never gate a pull request: MUTATION of every line of every module, and SMOKE-PAID
# (docs/quality/checks.md). mutation.yml checks the changed lines of each pull request.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every module that has a mutation script, so a new module joins without a change here.
  modules:
    name: modules with a mutation script
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          packages=$(node -e '
            const { readdirSync, readFileSync, existsSync } = require("node:fs");
            const names = readdirSync("modules")
              .map((dir) => `modules/${dir}/package.json`)
              .filter((file) => existsSync(file))
              .map((file) => JSON.parse(readFileSync(file, "utf8")))
              .filter((manifest) => manifest.scripts?.mutation)
              .map((manifest) => manifest.name);
            console.log(JSON.stringify(names));')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  # One runner per module: a full run of one module takes 45 to 90 minutes.
  mutation:
    name: mutation (${{ matrix.package }})
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.modules.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      # The pinned binaries of make install, such as opa for gatekeeper, for the commands that skip make.
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      # Capture scenarios open pages in Chromium: install it when the module depends on playwright-core.
      - name: Install the browser of a module that captures pages
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if grep -l "\"name\": \"$PACKAGE\"" modules/*/package.json | xargs grep -q '"playwright-core"'; then
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright" \
              pnpm --filter "$PACKAGE" exec playwright-core install --with-deps chromium
          fi
      # The kubernetes sandbox adapter's tests need a cluster with agent-sandbox (ADR 0055).
      - name: Start kind with agent-sandbox
        if: matrix.package == '@opensoftware/sandbox-kubernetes'
        uses: ./.github/actions/kind-agent-sandbox
      - run: pnpm exec turbo run mutation --filter="$PACKAGE" -- --all
        env:
          PACKAGE: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/mutation/

  mutation-score:
    name: mutation score
    needs: mutation
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - uses: actions/download-artifact@v5
        with:
          pattern: mutation-*
          path: reports/mutation/
          merge-multiple: true
      - run: pnpm --silent run osf check MUTATION --total
      # A run started by hand on another branch only reports.
      - name: Open a ticket when the mutation score falls
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "MUTATION: score fell in the nightly run" \
            --body "The nightly mutation run failed: $RUN_URL"

  smoke-paid:
    name: smoke-paid
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: smoke-paid
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      # The owner's choice in ADR 0077: the one model the OpenRouter key allows, 20 USD a month as its credit limit.
      - run: make smoke-paid
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_MODEL: deepseek/deepseek-v4.1-flash-1017
          OPENAI_MODEL: deepseek/deepseek-v4.1-flash-1017
