# The scorekit dogfood (ADR 0077): every scorer of the pack judges this repository's runs/ with a real model. The
# scores of earlier nights come from the cache, so a night pays only for the runs it has not scored. The report is
# the job summary of each run and the artifact scorekit-report.
name: scores

on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment that holds the OpenRouter key of the paid runs.
    environment: smoke-paid
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scorekit of this commit, so the scores never wait for a release.
      - run: pnpm exec turbo run build --filter=@opensoftware/scorekit...
      - uses: actions/cache/restore@v4
        with:
          path: scores/scores.jsonl
          key: scores-${{ github.run_id }}
          restore-keys: scores-
      # The first night has no scores yet; report and the cache need the file.
      - run: mkdir -p scores && touch scores/scores.jsonl
      # The owner's choice in ADR 0077: the one model the OpenRouter key allows, 20 USD a month as its credit limit.
      - name: Score the runs
        env:
          SCOREKIT_INFERENCE_URL: https://openrouter.ai/api/v1
          SCOREKIT_INFERENCE_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: deepseek/deepseek-v4.1-flash-1017
        run: |
          status=0
          for scorer in $(node modules/scorekit/dist/cli.js scorers | awk '{print $1}'); do
            node modules/scorekit/dist/cli.js score --scorer "$scorer" --model "$MODEL" --out scores/scores.jsonl runs \
              || status=1
          done
          exit $status
      # The scores so far are kept even when one judge call failed, so the next night does not pay for them again.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scores/scores.jsonl
          key: scores-${{ github.run_id }}
      - name: Write the report
        if: always()
        run: |
          node modules/scorekit/dist/cli.js report --out scores/report.json --markdown scores/report.md scores/scores.jsonl
          cat scores/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorekit-report
          path: scores/
