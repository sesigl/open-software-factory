# The paid factory run (ADR 0128, T-21 foreman): the factory of main implements one issue of this repository that
# carries the label `factory`, with a paid model on OpenRouter, and opens its pull request from the branch
# factory/issue-<n>. Only a person starts it, and only a maintainer or an admin of this repository: GitHub lets only
# people with write access dispatch a workflow, and the job guard narrows that to the permissions maintain and admin.
# The agent pushes and opens the pull request with this job's GITHUB_TOKEN. A pull request that GITHUB_TOKEN opens
# starts no workflow, so a maintainer pushes to it or re-runs its checks; a person reviews it before it is merged
# (AGENTS.md). Expected cost: a few cents; LiteLLM stops the run's model calls at 0.50 USD.
#
#   gh workflow run paid-factory-run.yml -f issue=<number>
name: paid factory run

on:
  workflow_dispatch:
    inputs:
      issue:
        description: The number of an open issue of this repository with the label factory.
        required: true
      model:
        description: The OpenRouter model; the default is the one weekly-paid.yml uses.
        required: true
        default: deepseek/deepseek-v4.1-flash-1017

permissions:
  contents: read

concurrency:
  group: paid-factory-run
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Allow only a maintainer or an admin of this repository
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          echo "$ACTOR has the permission $permission."
          case "$permission" in
            admin | maintain) ;;
            *) echo "::error::Only a maintainer or an admin starts the paid factory run." && exit 1 ;;
          esac

  run:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The agent pushes the branch factory/issue-<n> and opens its pull request with this token; it reads the issue.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    # The environment that holds the OpenRouter key of the paid runs (ADR 0077).
    environment: smoke-paid
    steps:
      - uses: actions/checkout@v5
        with:
          # The token stays out of .git/config of the checkout; run.sh hands it to the agent through ~/.netrc.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the e2e image of this checkout
        run: |
          pnpm exec turbo run build --filter=@opensoftware/e2e...
          node e2e/scripts/images.ts
      # The key goes only into this step, and run.sh gives it only to the service litellm. The forge token goes only
      # into ~/.netrc of foreman's container, masked in the log.
      - name: Run the factory on the issue
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          MODEL: ${{ inputs.model }}
          OUT: ${{ runner.temp }}/factory-run
        run: e2e/paid/factory/run.sh
      - name: Write the summary
        if: always()
        run: cat "$RUNNER_TEMP/factory-run/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-factory-run
          path: ${{ runner.temp }}/factory-run/
