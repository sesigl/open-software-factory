# The required check for every pull request: `make verify` (docs/quality/checks.md).
name: verify

on:
  pull_request:
    # edited: DOCS-AFFECTED reads `docs-reviewed:` lines from the description.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # the description of the merged pull request, for pushes to main

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install

      - name: Pull request context for DOCS-AFFECTED
        if: github.event.pull_request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports
          printf '%s\n' "$PR_BODY" > reports/pr-body.md
          {
            echo "OSF_BASE=$BASE_SHA"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A push to main has no description of its own: DOCS-AFFECTED reads the one of the merged pull request.
      - name: Push context for DOCS-AFFECTED
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > reports/pr-body.md
          {
            echo "OSF_BASE=$BEFORE"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # Pull the images of the testkit's container fakes (packages/testkit/src/fakes/services.ts) before the tests,
      # so that unpacking them does not slow the suites that run in parallel and count against BUDGET.
      - name: Pull the images of the container fakes
        run: |
          for image in postgres:17.6-alpine nats:2.11.9-alpine temporalio/temporal:1.4.1 chrislusf/seaweedfs:3.97 \
            code.forgejo.org/forgejo/forgejo:11 otel/opentelemetry-collector-contrib:0.148.0 testcontainers/sshd:1.4.0 testcontainers/ryuk:0.14.0; do
            docker pull --quiet "$image" &
          done
          wait

      - run: make verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit/
          if-no-files-found: ignore
