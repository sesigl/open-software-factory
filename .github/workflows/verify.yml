# The required check for every pull request: `make verify` (docs/quality/checks.md).
name: verify

on:
  pull_request:
    # edited: DOCS-AFFECTED reads `docs-reviewed:` lines from the description.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # release-please.yml starts verify this way on release pull requests (docs/quality/checks.md).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the description of the merged pull request, for pushes to main

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `make verify` in three parts (Makefile): verify-static and verify-tests run side by side, then verify-checks
  # reads every result. Each test suite gets its own runner, so suites never share cores and BUDGET stays fair.
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - run: make verify-static

  tests:
    name: tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: testkit
            filter: "@opensoftware/testkit"
            images: postgres nats temporal s3 forge
          - suite: factory-spec
            filter: "@opensoftware/factory-spec"
            images: forge
          - suite: tools
            filter: "@opensoftware/tools"
          - suite: runlog
            filter: "@opensoftware/runlog"
          # Every other package, so a new module runs without a change here.
          - suite: rest
            filter: "!@opensoftware/testkit !@opensoftware/factory-spec !@opensoftware/tools !@opensoftware/runlog"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      # The scenarios start these containers (ADR 0016). Pulling them now overlaps the download with the build.
      - name: Pull the container images in the background
        if: matrix.images
        env:
          IMAGES: ${{ matrix.images }}
        run: |
          for image in $(node -e 'import("./packages/testkit/src/fakes/services.ts").then(({ IMAGES: all }) =>
            console.log(process.env.IMAGES.split(" ").map((name) => all[name]).join(" ")))'); do
            nohup docker pull --quiet "$image" >/dev/null 2>&1 &
          done
      - run: make verify-tests FILTER="$FILTER"
        env:
          FILTER: ${{ matrix.filter }}
      # Coverage files are named after the process ID, which repeats across runners: prefix them with the suite.
      - name: Name the coverage files after the suite
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          shopt -s nullglob
          for file in reports/coverage/*.json; do mv "$file" "reports/coverage/$SUITE-${file##*/}"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.suite }}
          path: |
            reports/junit/
            reports/coverage/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify
    needs: [static, tests]
    # The checks run even when tests fail, so PASS can name each failing scenario.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install

      - name: Pull request context for DOCS-AFFECTED
        if: github.event.pull_request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports
          printf '%s\n' "$PR_BODY" > reports/pr-body.md
          {
            echo "OSF_BASE=$BASE_SHA"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A push to main has no description of its own: DOCS-AFFECTED reads the one of the merged pull request.
      - name: Push context for DOCS-AFFECTED
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > reports/pr-body.md
          {
            echo "OSF_BASE=$BEFORE"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A dispatched run on a release branch: OSF_BASE defaults to the merge base with main (Makefile).
      - name: Release pull request context for DOCS-AFFECTED
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          gh pr list --repo "$REPO" --head "$GITHUB_REF_NAME" --json body --jq '.[0].body // ""' > reports/pr-body.md
          echo "OSF_PR_BODY=reports/pr-body.md" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          pattern: reports-*
          path: reports/
          merge-multiple: true

      - run: make verify-checks

      - name: Lint, typecheck, build and every test suite passed
        env:
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint, typecheck, build: $STATIC; tests: $TESTS"
          [ "$STATIC" = success ] && [ "$TESTS" = success ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit/
          if-no-files-found: ignore
