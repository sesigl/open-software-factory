# The required check for every pull request: `make verify` (docs/quality/checks.md).
name: verify

on:
  pull_request:
    # edited: DOCS-AFFECTED reads `docs-reviewed:` lines from the description.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # release-please.yml starts verify this way on release pull requests (docs/quality/checks.md). The run uses this
  # file from main, merges the pull request into main and reports a commit status on its head.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the release pull request to verify
        required: true

permissions:
  contents: read
  pull-requests: read # the description of the merged pull request, for pushes to main
  statuses: write # the result of a dispatched run on the release pull request's head

concurrency:
  group: verify-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  # `make verify` in three parts (Makefile): verify-static and verify-tests run side by side, then verify-checks
  # reads every result. Each test suite gets its own runner, so suites never share cores and BUDGET stays fair.
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.pr && '0' || '1' }}
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore the turbo cache of lint, typecheck and build
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-static-
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install
      - run: make verify-static
        env:
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - name: Save the turbo cache of lint, typecheck and build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  tests:
    name: tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: testkit
            filter: "@opensoftware/testkit"
            images: s3 forge
            pull: curlimages/curl:8.17.0 nats:2.11.9-alpine node:24.11.1-bookworm-slim
            # sut.helm installs a chart on kind (ADR 0075).
            cluster: kind
          - suite: factory-spec
            filter: "@opensoftware/factory-spec"
            images: forge
          - suite: tools
            filter: "@opensoftware/tools"
          - suite: runlog
            filter: "@opensoftware/runlog"
            images: collector
          - suite: proof
            filter: "@opensoftware/proof"
            images: s3 forge
            browser: chromium
          - suite: ledger
            filter: "@opensoftware/ledger"
            images: postgres forge
          - suite: observer
            filter: "@opensoftware/observer"
            images: forge
          - suite: gatekeeper
            filter: "@opensoftware/gatekeeper"
          - suite: intake
            filter: "@opensoftware/intake"
          # Each scenario starts the Temporal dev server and runs the scripted harness behind harness-acp (ADR 0067).
          - suite: foreman
            filter: "@opensoftware/foreman"
          # Each scenario starts sandboxes of the test template behind iron-proxy (ADR 0054).
          - suite: sandbox-docker
            filter: "@opensoftware/sandbox-docker"
            pull: ironsh/iron-proxy:0.54.0 curlimages/curl:8.17.0 hello-world:latest
          # The same scenarios on kind with agent-sandbox; each sandbox is a claim behind an egress pod (ADR 0055).
          - suite: sandbox-kubernetes
            filter: "@opensoftware/sandbox-kubernetes"
            kind: true
          # Each scenario starts its own gateway: LiteLLM and PostgreSQL containers (ADR 0056).
          - suite: inference-litellm
            filter: "@opensoftware/inference-litellm"
            pull: ghcr.io/berriai/litellm:v1.106.2 postgres:18-alpine
          # Each scenario starts its own Forgejo; the webhook scenarios wait for its deliveries (ADR 0057).
          - suite: forge-forgejo
            filter: "@opensoftware/forge-forgejo"
            images: forge
          # Each scenario starts the Compose profile as its own project (ADR 0074), or installs the Helm chart in a
          # namespace of its own on kind, which gets the images of the chart first (ADR 0075).
          - suite: deploy
            filter: "@opensoftware/deploy"
            cluster: kind
            kind-images: true
            # Four scenarios install the whole chart, each with PostgreSQL, NATS and Temporal of its own.
            timeout: 40
            pull: >-
              pgvector/pgvector:0.8.7-pg17-trixie temporalio/admin-tools:1.31.4 temporalio/server:1.31.4
              temporalio/ui:2.57.0 nats:2.11.9-alpine chrislusf/seaweedfs:3.97 arizephoenix/phoenix:version-20.26.1
              ghcr.io/berriai/litellm:v1.106.2 openpolicyagent/opa:1.21.0-static node:24.11.1-bookworm-slim
          # The smoke scenarios start the Compose profile with every module from one image of the workspace, which
          # the suite builds first, and the testkit's fakes on the runner (ADR 0076).
          - suite: e2e
            filter: "@opensoftware/e2e"
            images: forge
            pull: >-
              pgvector/pgvector:0.8.7-pg17-trixie temporalio/admin-tools:1.31.4 temporalio/server:1.31.4
              temporalio/ui:2.57.0 nats:2.11.9-alpine chrislusf/seaweedfs:3.97 arizephoenix/phoenix:version-20.26.1
              ghcr.io/berriai/litellm:v1.106.2 openpolicyagent/opa:1.21.0-static node:24.11.1-bookworm
          # Every other package, so a new module runs without a change here.
          - suite: rest
            filter: "!@opensoftware/testkit !@opensoftware/factory-spec !@opensoftware/tools !@opensoftware/runlog !@opensoftware/proof !@opensoftware/ledger !@opensoftware/observer !@opensoftware/gatekeeper !@opensoftware/intake !@opensoftware/foreman !@opensoftware/sandbox-docker !@opensoftware/sandbox-kubernetes !@opensoftware/inference-litellm !@opensoftware/forge-forgejo !@opensoftware/deploy !@opensoftware/e2e"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Pull requests replay the results of the suites whose inputs did not change; everything else runs all suites
      # (ADR 0081). The cache of main is readable by every pull request. The key names the run: two runs of one merge
      # commit, such as one cancelled by an edit of the description, must not share a key, or the first one wins.
      - name: Restore the turbo cache of the suite
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-${{ matrix.suite }}-
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install
      # run=false when every system test task of the suite is a cache hit: the slow setup below is then not needed.
      - name: Plan the suite
        id: plan
        env:
          FILTER: ${{ matrix.filter }}
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          run=true
          if [ -n "$OSF_TEST_CACHE" ]; then
            filters=$(for f in $FILTER; do printf -- '--filter=%s ' "$f"; done)
            # shellcheck disable=SC2086
            pnpm exec turbo run test:system --dry=json $filters > "$RUNNER_TEMP/plan.json"
            jq -r '.tasks[] | select(.task == "test:system") | "\(.taskId) \(.hash) \(.cache.status)"' "$RUNNER_TEMP/plan.json"
            misses=$(jq '[.tasks[] | select(.task == "test:system" and .cache.status != "HIT")] | length' "$RUNNER_TEMP/plan.json")
            if [ "$misses" = 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # The scenarios start these containers (ADR 0016). Pulling them now overlaps the download with the build.
      - name: Pull the container images in the background
        if: steps.plan.outputs.run == 'true' && matrix.images
        env:
          IMAGES: ${{ matrix.images }}
        run: |
          for image in $(node -e 'import("./packages/testkit/src/fakes/services.ts").then(({ IMAGES: all }) =>
            console.log(process.env.IMAGES.split(" ").map((name) => all[name]).join(" ")))'); do
            nohup docker pull --quiet "$image" >/dev/null 2>&1 &
            echo $! >> "$RUNNER_TEMP/pulls"
          done
      # Images a suite needs besides the testkit's fakes, named in full.
      - name: Pull the suite's own images in the background
        if: steps.plan.outputs.run == 'true' && matrix.pull
        env:
          PULL: ${{ matrix.pull }}
        run: |
          for image in $PULL; do
            nohup docker pull --quiet "$image" >/dev/null 2>&1 &
            echo $! >> "$RUNNER_TEMP/pulls"
          done
      # A kind cluster with agent-sandbox for the kubernetes sandbox adapter (ADR 0055).
      - name: Start kind with agent-sandbox
        if: steps.plan.outputs.run == 'true' && matrix.kind
        uses: ./.github/actions/kind-agent-sandbox
      # A kind cluster for the scenarios that install a Helm chart (ADR 0075).
      - name: Start kind
        if: steps.plan.outputs.run == 'true' && matrix.cluster == 'kind'
        uses: ./.github/actions/kind
      # The images of the chart osf, pulled from GHCR or built at the pins of compose.yaml, loaded into kind.
      - name: Load the images of the Helm chart into kind
        if: steps.plan.outputs.run == 'true' && matrix.kind-images
        run: deploy/helm/kind-images.sh
      # proof capture opens pages in Chromium (ADR 0029); the testkit hands PLAYWRIGHT_BROWSERS_PATH to the module.
      - name: Install the browser of the capture scenarios
        if: steps.plan.outputs.run == 'true' && matrix.browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright" \
            pnpm --filter @opensoftware/proof exec playwright-core install --with-deps "$BROWSER"
      # BUDGET measures the tests, not the pulls: a test that starts before its image is there waits for it.
      - name: Wait for the image pulls
        if: steps.plan.outputs.run == 'true' && (matrix.images || matrix.pull)
        run: |
          [ -f "$RUNNER_TEMP/pulls" ] || exit 0
          while read -r pid; do
            while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          done < "$RUNNER_TEMP/pulls"
      - run: make verify-tests FILTER="$FILTER"
        env:
          FILTER: ${{ matrix.filter }}
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
      # A release that did not get ready: the pods of every namespace and why they wait, for the log.
      - name: Show the state of the kind cluster
        if: (failure() || cancelled()) && matrix.cluster == 'kind'
        run: |
          kubectl=.tools/bin/kubectl
          $kubectl get pods --all-namespaces --output wide || true
          $kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 80 || true
          $kubectl get pods --all-namespaces --no-headers | awk '$4 !~ /Running|Completed/ || $3 ~ /^0\//' |
            while read -r namespace pod _; do
              $kubectl describe pod --namespace "$namespace" "$pod" | tail -n 30
              $kubectl logs --namespace "$namespace" "$pod" --all-containers --tail 30 || true
            done
      # The hash each test task ran with, to compare with the plan above.
      - name: Show the hashes of the test run
        if: always()
        run: |
          shopt -s nullglob
          for summary in .turbo/runs/*.json; do
            jq -r '.tasks[] | select(.task == "test:system") | "\(.taskId) \(.hash) \(.cache.status)"' "$summary"
          done
      - name: Save the turbo cache of the suite
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.suite }}
          path: |
            reports/junit/
            reports/coverage/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify
    needs: [static, tests]
    # The checks run even when tests fail, so PASS can name each failing scenario.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the proof comment, and the description of the merged pull request for pushes to main
      statuses: write # the commit status proof, and the result of a dispatched run on the release pull request's head
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # verify-checks builds every package before the checks; the static job of this run built and saved them all.
      - name: Restore the builds of the static job
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install

      - name: Pull request context for DOCS-AFFECTED
        if: github.event.pull_request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports
          printf '%s\n' "$PR_BODY" > reports/pr-body.md
          {
            echo "OSF_BASE=$BASE_SHA"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A push to main has no description of its own: DOCS-AFFECTED reads the one of the merged pull request.
      - name: Push context for DOCS-AFFECTED
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > reports/pr-body.md
          {
            echo "OSF_BASE=$BEFORE"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A dispatched run: OSF_BASE defaults to the merge base with main (Makefile), so main itself.
      - name: Release pull request context for DOCS-AFFECTED
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          mkdir -p reports
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > reports/pr-body.md
          echo "OSF_PR_BODY=reports/pr-body.md" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          pattern: reports-*
          path: reports/
          merge-multiple: true

      - run: make verify-checks

      # Dogfood of spec-trace (ADR 0031): the report with the scenarios this change adds, removes or changes, as the
      # job summary and the artifact spec-trace. make verify-checks ran its rules already. The action runs the release
      # of the version in modules/spec-trace/package.json from npm.
      # A release pull request raises the version before it is on npm: then the step runs the build of this commit.
      - name: Pick the spec-trace command
        id: spec-trace
        if: always()
        run: |
          version=$(jq -r .version modules/spec-trace/package.json)
          if npm view "@opensoftware/spec-trace@$version" version >/dev/null 2>&1; then
            echo "command=" >> "$GITHUB_OUTPUT"
          else
            echo "command=node $PWD/modules/spec-trace/dist/cli.js" >> "$GITHUB_OUTPUT"
          fi
      - name: spec-trace
        if: always()
        uses: ./modules/spec-trace
        with:
          rules: ""
          command: ${{ steps.spec-trace.outputs.command }}

      - name: Lint, typecheck, build and every test suite passed
        env:
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint, typecheck, build: $STATIC; tests: $TESTS"
          [ "$STATIC" = success ] && [ "$TESTS" = success ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit/
          if-no-files-found: ignore

      # Dogfood of proof (ADR 0029): the JUnit reports of every suite as evidence, one comment and the commit status
      # proof on each pull request from this repository. A fork's token may not comment. The action runs the release
      # of the version in modules/proof/package.json from npm.
      - name: proof
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./modules/proof
        with:
          junit: reports/junit/*.xml

      # A dispatched run belongs to main, so its check does not show on the release pull request: report a status.
      - name: Report the result on the release pull request
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$STATE" -f context=verify \
            -f target_url="$URL" -f description="make verify on the merge into main"
