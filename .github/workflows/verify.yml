# The required check for every pull request: `make verify` (docs/quality/checks.md).
name: verify

on:
  pull_request:
    # edited: DOCS-AFFECTED reads `docs-reviewed:` lines from the description. ready_for_review: a draft runs no
    # mutation, so marking it ready starts it.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # release-please.yml starts verify this way on release pull requests (docs/quality/checks.md). The run uses this
  # file from main, merges the pull request into main and reports a commit status on its head.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the release pull request to verify
        required: true

permissions:
  contents: read
  pull-requests: read # the description of the merged pull request, for pushes to main
  statuses: write # the result of a dispatched run on the release pull request's head

concurrency:
  group: verify-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  # `make verify` in three parts (Makefile): verify-static and verify-tests run side by side, then verify-checks
  # reads every result. Each test suite gets its own runner, so suites never share cores and BUDGET stays fair.
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.pr && '0' || '1' }}
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore the turbo cache of lint, typecheck and build
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-static-
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make verify-static
        env:
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - name: Save the turbo cache of lint, typecheck and build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Plans the test suites (ADR 0094). The suites are in .github/test-suites.yml. On a pull request, turbo's dry run
  # finds each suite with a system test task that the cache cannot replay; this job replays the other suites and
  # uploads their results, so only the suites with work start a runner. Outside pull requests every suite runs
  # (ADR 0081).
  plan:
    name: plan the suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.pr && '0' || '1' }}
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The one turbo cache of the test suites, with the builds and the results of every suite.
      - name: Restore the turbo cache of the tests
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-tests-
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A suite runs when one of its packages has a test task that is no cache hit. A filter names packages: the
      # suite's own, or with "!" the packages that it leaves to the other suites.
      - name: Plan the suites
        id: plan
        env:
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          suites=$(yq --output-format=json --indent=0 '.' .github/test-suites.yml)
          if [ -z "$OSF_TEST_CACHE" ]; then
            echo "suites=$suites" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec turbo run test:system --dry=json > "$RUNNER_TEMP/plan.json"
          tasks='[.tasks[] | select(.task == "test:system" and .command != "<NONEXISTENT>")]'
          jq -r "$tasks | .[] | \"\\(.taskId) \\(.hash) \\(.cache.status)\"" "$RUNNER_TEMP/plan.json"
          tested=$(jq -c "$tasks | map(.package)" "$RUNNER_TEMP/plan.json")
          misses=$(jq -c "$tasks | map(select(.cache.status != \"HIT\") | .package)" "$RUNNER_TEMP/plan.json")
          run=$(jq -c --argjson tested "$tested" --argjson misses "$misses" '
            map(select(
              (.filter | split(" ") | map(select(. != ""))) as $parts
              | ($parts | map(select(startswith("!") | not))) as $only
              | ($parts | map(select(startswith("!")) | ltrimstr("!"))) as $not
              | (if ($only | length) > 0 then $only else $tested - $not end) as $packages
              | ($packages - ($packages - $misses) | length) > 0
            ))' <<<"$suites")
          jq -r --argjson run "$run" '($run | map(.suite)) as $names | .[] | select(.suite as $s | $names | index($s) | not) | .filter' \
            <<<"$suites" > "$RUNNER_TEMP/replay"
          echo "runs: $(jq -r 'map(.suite) | join(" ")' <<<"$run")"
          echo "replays: $(wc -l < "$RUNNER_TEMP/replay") suites"
          echo "suites=$run" >> "$GITHUB_OUTPUT"
      # One suite at a time, as verify-tests runs them: a filter with "!" would leave out the packages of the others.
      - name: Replay the suites without work
        if: github.event_name == 'pull_request'
        env:
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          status=0
          while read -r filter; do
            make verify-tests FILTER="$filter" || status=1
          done < "$RUNNER_TEMP/replay"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          # The attempt in the name: a rerun of a job adds its reports, and verify takes the newest (see there).
          name: reports-replayed-a${{ github.run_attempt }}
          path: |
            reports/junit/
            reports/coverage/
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: tests (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The one turbo cache of the test suites, with the builds and the results of every suite (ADR 0094).
      - name: Restore the turbo cache of the tests
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-tests-
      # The cache entries that this job writes are newer than this file.
      - run: touch "$RUNNER_TEMP/restored"
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The scenarios start these containers (ADR 0016). Pulling them now overlaps the download with the build.
      - name: Pull the container images in the background
        if: matrix.images
        env:
          IMAGES: ${{ matrix.images }}
        run: |
          for image in $(node -e 'import("./packages/testkit/src/fakes/services.ts").then(({ IMAGES: all }) =>
            console.log(process.env.IMAGES.split(" ").map((name) => all[name]).join(" ")))'); do
            nohup docker pull --quiet "$image" >/dev/null 2>&1 &
            echo $! >> "$RUNNER_TEMP/pulls"
          done
      # Images a suite needs besides the testkit's fakes, named in full.
      - name: Pull the suite's own images in the background
        if: matrix.pull
        env:
          PULL: ${{ matrix.pull }}
        run: |
          for image in $PULL; do
            nohup docker pull --quiet "$image" >/dev/null 2>&1 &
            echo $! >> "$RUNNER_TEMP/pulls"
          done
      # A kind cluster with agent-sandbox for the kubernetes sandbox adapter (ADR 0055).
      - name: Start kind with agent-sandbox
        if: matrix.kind
        uses: ./.github/actions/kind-agent-sandbox
      # A kind cluster for the scenarios that install a Helm chart (ADR 0075).
      - name: Start kind
        if: matrix.cluster == 'kind'
        uses: ./.github/actions/kind
      # The images of the chart osf, pulled from GHCR or built at the pins of compose.yaml, loaded into kind.
      - name: Load the images of the Helm chart into kind
        if: matrix.kind-images
        run: deploy/helm/kind-images.sh
      # proof capture opens pages in Chromium (ADR 0029); the testkit hands PLAYWRIGHT_BROWSERS_PATH to the module.
      - name: Install the browser of the capture scenarios
        if: matrix.browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright" \
            pnpm --filter @opensoftware/proof exec playwright-core install --with-deps "$BROWSER"
      # BUDGET measures the tests, not the pulls: a test that starts before its image is there waits for it.
      - name: Wait for the image pulls
        if: (matrix.images || matrix.pull)
        run: |
          [ -f "$RUNNER_TEMP/pulls" ] || exit 0
          while read -r pid; do
            while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          done < "$RUNNER_TEMP/pulls"
      - run: make verify-tests FILTER="$FILTER"
        env:
          FILTER: ${{ matrix.filter }}
          OSF_TEST_CACHE: ${{ github.event_name == 'pull_request' && '1' || '' }}
      # A release that did not get ready: the pods of every namespace and why they wait, for the log.
      - name: Show the state of the kind cluster
        if: (failure() || cancelled()) && (matrix.cluster == 'kind' || matrix.kind)
        run: |
          kubectl=.tools/bin/kubectl
          $kubectl get pods --all-namespaces --output wide || true
          $kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 80 || true
          $kubectl get pods --all-namespaces --no-headers | awk '$4 !~ /Running|Completed/ || $3 ~ /^0\//' |
            while read -r namespace pod _; do
              $kubectl describe pod --namespace "$namespace" "$pod" | tail -n 30
              $kubectl logs --namespace "$namespace" "$pod" --all-containers --tail 30 || true
            done
      # The hash each test task ran with, to compare with the plan above.
      - name: Show the hashes of the test run
        if: always()
        run: |
          shopt -s nullglob
          for summary in .turbo/runs/*.json; do
            jq -r '.tasks[] | select(.task == "test:system") | "\(.taskId) \(.hash) \(.cache.status)"' "$summary"
          done
      # A result over its budget stays out of the cache: replayed, it would fail BUDGET in every later pull request
      # whose inputs of the suite are the same, while main, which runs every suite, passes. verify reports BUDGET.
      - name: Check the budget of the suite
        id: budget
        if: always()
        continue-on-error: true
        run: pnpm --silent run osf check BUDGET
      # The job cache joins the new entries of every suite into the turbo cache of the tests.
      - name: Keep the new cache entries of the suite
        if: always() && steps.budget.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/turbo-new"
          find .turbo/cache -maxdepth 1 -type f -newer "$RUNNER_TEMP/restored" -exec cp -p {} "$RUNNER_TEMP/turbo-new/" \;
      - uses: actions/upload-artifact@v4
        if: always() && steps.budget.outcome == 'success'
        with:
          name: turbo-${{ matrix.suite }}
          path: ${{ runner.temp }}/turbo-new/
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.suite }}-a${{ github.run_attempt }}
          path: |
            reports/junit/
            reports/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # Joins the new cache entries of the suites into the turbo cache of the tests and saves it once. An entry that no
  # run restored for 14 days goes, so the cache does not grow without end.
  cache:
    name: save the test cache
    needs: [plan, tests]
    if: always() && !cancelled() && needs.tests.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Restore the turbo cache of the tests
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-tests-
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: turbo-*
          path: .turbo/cache/
          merge-multiple: true
      - name: Remove the entries older than 14 days
        run: find .turbo/cache -maxdepth 1 -type f -mtime +14 -delete
      - name: Save the turbo cache of the tests
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  verify:
    name: verify
    needs: [static, plan, tests]
    # The checks run even when tests fail, so PASS can name each failing scenario.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the proof comment, and the description of the merged pull request for pushes to main
      statuses: write # the commit status proof, and the result of a dispatched run on the release pull request's head
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A dispatched run tests the release pull request merged into main. GitHub's merge ref can lag behind main.
      - name: Merge the release pull request into main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          git -c user.name=verify -c user.email=verify@invalid merge --no-edit FETCH_HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # verify-checks builds every package before the checks; the static job of this run built and saved them all.
      - name: Restore the builds of the static job
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The pinned binaries of install-tools: a new pin in install-tools.ts makes a new key. Without it, each job
      # downloads all eight from their sites, which takes about 8 s and failed when one site did not answer.
      - name: Restore the pinned tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/scaffold/install-tools.ts') }}
      - run: make install
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pull request context for DOCS-AFFECTED
        if: github.event.pull_request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports
          printf '%s\n' "$PR_BODY" > reports/pr-body.md
          {
            echo "OSF_BASE=$BASE_SHA"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A push to main has no description of its own: DOCS-AFFECTED reads the one of the merged pull request.
      - name: Push context for DOCS-AFFECTED
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > reports/pr-body.md
          {
            echo "OSF_BASE=$BEFORE"
            echo "OSF_PR_BODY=reports/pr-body.md"
          } >> "$GITHUB_ENV"

      # A dispatched run: OSF_BASE defaults to the merge base with main (Makefile), so main itself.
      - name: Release pull request context for DOCS-AFFECTED
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          mkdir -p reports
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > reports/pr-body.md
          echo "OSF_PR_BODY=reports/pr-body.md" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          pattern: reports-*
          path: ${{ runner.temp }}/reports/
      # A rerun of a job uploads its reports again, under the new attempt. Merged in any order, the first attempt's
      # JUnit file could win: BUDGET then read the slow run that the rerun was for. The newest attempt is copied last.
      - name: Join the reports, the newest attempt of each job last
        run: |
          mkdir -p reports
          for dir in $(ls -d "$RUNNER_TEMP"/reports/*/ | sort -V); do cp -R "$dir". reports/; done

      - run: make verify-checks

      # Dogfood of spec-trace (ADR 0031): the report with the scenarios this change adds, removes or changes, as the
      # job summary and the artifact spec-trace. make verify-checks ran its rules already. The action runs the build
      # of this commit, which verify-checks made (ADR 0083).
      - name: spec-trace
        if: always()
        uses: ./modules/spec-trace
        with:
          rules: ""
          command: node modules/spec-trace/dist/cli.js

      # The tests job is skipped when the plan replayed every suite.
      - name: Lint, typecheck, build and every test suite passed
        env:
          STATIC: ${{ needs.static.result }}
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint, typecheck, build: $STATIC; plan and replays: $PLAN; tests: $TESTS"
          [ "$STATIC" = success ] && [ "$PLAN" = success ] && { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit/
          if-no-files-found: ignore

      # Dogfood of proof (ADR 0029): the JUnit reports of every suite as evidence, one comment and the commit status
      # proof on each pull request from this repository. A fork's token may not comment. The action runs the build of
      # this commit (ADR 0083).
      - name: proof
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./modules/proof
        with:
          junit: reports/junit/*.xml
          command: node modules/proof/dist/cli.js

      # A dispatched run belongs to main, so its check does not show on the release pull request: report a status.
      - name: Report the result on the release pull request
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$STATE" -f context=verify \
            -f target_url="$URL" -f description="make verify on the merge into main"

  # MUTATION (mutation.yml), only after verify passed: a pull request whose checks fail starts no mutation runners. A
  # run started by an edit of the description restores the reports of the shards that finished before (ADR 0092).
  mutation:
    name: mutation
    needs: verify
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.verify.result == 'success'
    uses: ./.github/workflows/mutation.yml
