# MUTATION on every pull request (docs/quality/checks.md, ADR 0037): Stryker mutates the source lines the pull request
# adds to each module and library, and the check fails when too few of those mutants make a system test fail.
# One runner per shard of about 100 added lines of a changed unit: each mutant reruns the unit's system tests, so a
# server module with a new file needs several runners to stay under the time limit.
name: mutation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The units with a mutation script whose TypeScript sources in src/ or bin/ the pull request changes, each cut
  # into shards of about 100 added lines: one runner per shard, so that a large change fits the time limit.
  units:
    name: units to mutate
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: list
        env:
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          shards=$(git diff --numstat --no-renames "$OSF_BASE"...HEAD | node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const unit = /^((?:modules|packages)\/[^/]+|adapters\/[^/]+\/[^/]+)\/(?:src|bin)\/.*\.ts$/;
            const added = new Map();
            for (const row of readFileSync(0, "utf8").split("\n")) {
              const [count, , file = ""] = row.split("\t");
              const dir = unit.exec(file)?.[1];
              if (!dir || !existsSync(`${dir}/package.json`)) continue;
              const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
              if (!manifest.scripts?.mutation) continue;
              added.set(manifest.name, (added.get(manifest.name) ?? 0) + (Number(count) || 0));
            }
            const shards = [...added].sort(([a], [b]) => a.localeCompare(b)).flatMap(([name, lines]) => {
              const count = Math.min(10, Math.max(1, Math.ceil(lines / 100)));
              return Array.from({ length: count }, (_, index) => ({ package: name, shard: `${index + 1}/${count}` }));
            });
            console.log(JSON.stringify(shards));')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  unit:
    name: mutation (${{ matrix.package }} ${{ matrix.shard }})
    needs: units
    if: needs.units.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.units.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      # The pinned binaries of make install, such as opa for gatekeeper, for the commands that skip make.
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      # Capture scenarios open pages in Chromium: install it when the unit depends on playwright-core.
      - name: Install the browser of a unit that captures pages
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if grep -l "\"name\": \"$PACKAGE\"" modules/*/package.json packages/*/package.json \
            | xargs grep -q '"playwright-core"'; then
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright" \
              pnpm --filter "$PACKAGE" exec playwright-core install --with-deps chromium
          fi
      # The kubernetes sandbox adapter's tests need a cluster with agent-sandbox (ADR 0055).
      - name: Start kind with agent-sandbox
        if: matrix.package == '@opensoftware/sandbox-kubernetes'
        uses: ./.github/actions/kind-agent-sandbox
      - run: pnpm exec turbo run mutation --filter="$PACKAGE" -- --shard "$SHARD"
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # The required check: scores the reports of all units. A unit without a report fails it.
  mutation:
    name: mutation
    needs: [units, unit]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - uses: actions/download-artifact@v5
        if: needs.units.outputs.shards != '[]'
        with:
          pattern: mutation-*
          path: reports/mutation/
          merge-multiple: true
      - run: pnpm --silent run osf check MUTATION
        env:
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
