# MUTATION on every pull request (docs/quality/checks.md, ADR 0037): Stryker mutates the source lines the pull request
# adds to each module and library, and the check fails when too few of those mutants make a system test fail.
# One runner per shard of about 100 added lines of a changed unit, or of the `osf.mutationLinesPerShard` lines its
# package.json sets: each mutant reruns the unit's system tests, so a server module with a new file needs several
# runners to stay under the time limit. Each shard tests every n-th mutant of all the added lines (ADR 0066). A shard
# reuses its report of an earlier push when its unit's turbo hash and added lines are the same; otherwise Stryker
# reuses the result of each mutant whose code and tests did not change, while nothing else the tests read changed
# (ADR 0091). verify.yml calls this workflow after its job verify passed, on a pull request that is no draft; a new
# push cancels the run with verify's own run (ADR 0092).
name: mutation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The units with a mutation script whose TypeScript sources in src/ or bin/ the pull request changes, each cut
  # into shards of about 100 added lines (osf mutation-plan): one runner per shard, so a large change fits the limit.
  units:
    name: units to mutate
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        env:
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          shards=$(pnpm --silent run osf mutation-plan --keys)
          echo "$shards" | jq -r '.[] | "\(.package) \(.shard)"'
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  unit:
    name: mutation (${{ matrix.package }} ${{ matrix.shard }})
    needs: units
    if: needs.units.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.units.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The report of a shard depends on its unit's mutation task, which turbo hashes with the builds it depends on,
      # and on the line ranges the change adds (osf mutation-plan --keys).
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: reports/mutation/
          key: mutation-v2-${{ matrix.key }}
      # The mutant results of the last finished run of this pull request (the mutation job saves them).
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: reports/mutation-incremental/
          key: mutation-results-v1-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: mutation-results-v1-${{ github.event.pull_request.number }}-
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/mutation-shard
        with:
          package: ${{ matrix.package }}
          shard: ${{ matrix.shard }}
          all: "false"
          base: ${{ github.event.pull_request.base.sha }}
          incremental: ${{ github.workspace }}/reports/mutation-incremental/${{ matrix.results }}
      # Only the report of a finished run: a run that failed or was cancelled leaves nothing to reuse.
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true' && hashFiles('reports/mutation/*.json') != ''
        with:
          path: reports/mutation/
          key: mutation-v2-${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # The required check: scores the reports of all units. A unit without a report fails it.
  mutation:
    name: mutation
    needs: [units, unit]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v5
        if: needs.units.outputs.shards != '[]'
        with:
          pattern: mutation-*
          path: reports/mutation/
          merge-multiple: true
      # The mutant results for the next push of this pull request: the earlier ones, with each unit whose shards all
      # have a report replaced by the joined reports (osf mutation-merge).
      - if: needs.units.outputs.shards != '[]'
        uses: actions/cache/restore@v4
        with:
          path: reports/mutation-incremental/
          key: mutation-results-v1-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: mutation-results-v1-${{ github.event.pull_request.number }}-
      - if: needs.units.outputs.shards != '[]'
        env:
          SHARDS: ${{ needs.units.outputs.shards }}
        run: |
          echo "$SHARDS" > "$RUNNER_TEMP/plan.json"
          pnpm --silent run osf mutation-merge "$RUNNER_TEMP/plan.json" reports/mutation-incremental
      - if: needs.units.outputs.shards != '[]'
        uses: actions/cache/save@v4
        with:
          path: reports/mutation-incremental/
          key: mutation-results-v1-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: pnpm --silent run osf check MUTATION
        env:
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
