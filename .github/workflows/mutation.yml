# MUTATION on every pull request (docs/quality/checks.md, ADR 0037): Stryker mutates the source lines the pull request
# adds to each module and library, and the check fails when too few of those mutants make a system test fail.
# One runner per shard of about 100 added lines of a changed unit, or of the `osf.mutationLinesPerShard` lines its
# package.json sets: each mutant reruns the unit's system tests, so a server module with a new file needs several
# runners to stay under the time limit. Each shard tests every n-th mutant
# of all the added lines, and reuses its report of an earlier push when nothing but runs/ changed (ADR 0066).
name: mutation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The units with a mutation script whose TypeScript sources in src/ or bin/ the pull request changes, each cut
  # into shards of about 100 added lines (osf mutation-plan): one runner per shard, so a large change fits the limit.
  units:
    name: units to mutate
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        env:
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          shards=$(pnpm --silent run osf mutation-plan)
          echo "$shards" | jq -r '.[] | "\(.package) \(.shard)"'
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  unit:
    name: mutation (${{ matrix.package }} ${{ matrix.shard }})
    needs: units
    if: needs.units.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.units.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The report of a shard depends on the files of the checkout and on the base: the changed lines come from the
      # diff to it. runs/ holds the session records of agents (ADR 0027), which no build or test reads, so a push
      # that only records a session reuses the report of the push before it.
      - name: Key of the shard's report
        id: key
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: |
          tree=$(git ls-tree -r HEAD | grep -v $'\truns/' | sha256sum | cut -c1-40)
          echo "key=mutation-v1-${PACKAGE//\//-}-${SHARD/\//-of-}-$BASE-$tree" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: reports/mutation/
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/mutation-shard
        with:
          package: ${{ matrix.package }}
          shard: ${{ matrix.shard }}
          all: "false"
          base: ${{ github.event.pull_request.base.sha }}
      # Only the report of a finished run: a run that failed or was cancelled leaves nothing to reuse.
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true' && hashFiles('reports/mutation/*.json') != ''
        with:
          path: reports/mutation/
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # The required check: scores the reports of all units. A unit without a report fails it.
  mutation:
    name: mutation
    needs: [units, unit]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - uses: actions/download-artifact@v5
        if: needs.units.outputs.shards != '[]'
        with:
          pattern: mutation-*
          path: reports/mutation/
          merge-multiple: true
      - run: pnpm --silent run osf check MUTATION
        env:
          OSF_BASE: ${{ github.event.pull_request.base.sha }}
