# The taskcapture dogfood (ADR 0045): a suite from this repository's merged pull requests, run every night with
# Harbor's oracle agent (the pull request's own change) and its nop agent (no change). The run fails unless the
# oracle solves every task and the no-op agent solves none. Neither agent calls a model, so the run costs nothing.
# Once a week, and when a person starts it with "models", the job models also runs opencode with a real model on
# the same suite (ADR 0077): every paid run in GitHub Actions runs once a week.
name: taskcapture suite

on:
  schedule:
    - cron: "23 2 * * *"
    - cron: "47 3 * * 1" # Monday: also the paid job models
  workflow_dispatch:
    inputs:
      models:
        description: Also run opencode with a real model on OpenRouter (paid)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: taskcapture-suite
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # capture reads the merge commits and their parents
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The taskcapture of this commit, so the suite never waits for a release.
      - run: pnpm exec turbo run build --filter=@opensoftware/taskcapture...
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install harbor==0.24.0
      # Pull requests whose system tests need no Docker, since a Harbor task runs in a container without one.
      - name: Capture the suite
        env:
          TASKCAPTURE_FORGE_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          while read -r number package; do
            node modules/taskcapture/dist/cli.js capture --git . --suite "$RUNNER_TEMP/suite" \
              --image node:24-bookworm --setup "corepack enable && pnpm install --frozen-lockfile" \
              --test-command "pnpm install --frozen-lockfile && pnpm exec turbo run test:system --filter=$package" \
              "$REPOSITORY/pull/$number"
          done <<'PULLS'
          45 @opensoftware/spec-trace
          47 @opensoftware/spec-trace
          49 @opensoftware/scorekit
          52 @opensoftware/scorekit
          PULLS
      - name: Run the oracle and the no-op agent
        run: |
          for agent in oracle nop; do
            node modules/taskcapture/dist/cli.js run --suite "$RUNNER_TEMP/suite" --jobs "$RUNNER_TEMP/jobs" \
              --agent "$agent" --configuration "$agent" --out "$RUNNER_TEMP/$agent.json"
          done
      - name: Report
        run: |
          node modules/taskcapture/dist/cli.js report --out "$RUNNER_TEMP/report.json" \
            --markdown "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/jobs/oracle" "$RUNNER_TEMP/jobs/nop"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check that the oracle solves every task and the no-op agent none
        run: |
          node -e '
            const { cells } = require(process.argv[1]);
            const cell = (agent) => cells.find((c) => c.configuration === agent);
            const oracle = cell("oracle");
            const nop = cell("nop");
            const problems = [];
            if (!oracle || oracle.incomplete || oracle.correctness !== 1) problems.push("the oracle does not solve every task");
            if (!nop || nop.incomplete || nop.correctness !== 0) problems.push("the no-op agent solves a task");
            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          ' "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskcapture-suite
          path: |
            ${{ runner.temp }}/suite/
            ${{ runner.temp }}/jobs/
            ${{ runner.temp }}/report.*

  models:
    needs: suite
    if: github.event.schedule == '47 3 * * 1' || inputs.models
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The environment that holds the OpenRouter key of the paid runs.
    environment: smoke-paid
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@opensoftware/taskcapture...
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install harbor==0.24.0
      - uses: actions/download-artifact@v4
        with:
          name: taskcapture-suite
          path: ${{ runner.temp }}
      # The owner's choice in ADR 0077: the one model the OpenRouter key allows. The agent reaches only OpenRouter.
      - name: Run opencode with a real model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node modules/taskcapture/dist/cli.js run --suite "$RUNNER_TEMP/suite" --jobs "$RUNNER_TEMP/jobs" \
            --agent opencode --model openrouter/deepseek/deepseek-v4.1-flash-1017 --configuration opencode \
            --allow-host openrouter.ai --out "$RUNNER_TEMP/opencode.json"
      - name: Report the model next to the oracle and the no-op agent
        if: always()
        run: |
          node modules/taskcapture/dist/cli.js report --out "$RUNNER_TEMP/report.json" \
            --markdown "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/jobs/oracle" "$RUNNER_TEMP/jobs/nop" \
            "$RUNNER_TEMP/jobs/opencode"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskcapture-models
          path: |
            ${{ runner.temp }}/jobs/opencode/
            ${{ runner.temp }}/report.*
