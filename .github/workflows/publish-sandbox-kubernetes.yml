# Publishes a sandbox-kubernetes release to npm as @opensoftware/sandbox-kubernetes. The one-time setup is in
# adapters/sandbox/kubernetes/README.md#releases.
name: publish-sandbox-kubernetes

on:
  # release-please creates the sandbox-kubernetes-v* release with GITHUB_TOKEN, and such a release starts no `release` or tag
  # workflow. workflow_run does follow it; the release job below publishes only when the run's commit carries a tag.
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  # Publishes a release again, for example after a failed upload. npm refuses a version it already has.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example sandbox-kubernetes-v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-sandbox-kubernetes
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(git tag --points-at "$HEAD_SHA" --list 'sandbox-kubernetes-v*' | sort -V | tail -n 1)
            # A release that never reached npm, for example after a failed upload, goes out with the next run.
            if [ -z "$tag" ]; then
              latest=$(git tag --list 'sandbox-kubernetes-v*' | sort -V | tail -n 1)
              if [ -n "$latest" ]; then
                name=$(git show "$latest:adapters/sandbox/kubernetes/package.json" | jq -r .name)
                if npm view "$name@${latest#sandbox-kubernetes-v}" version 2>&1 | grep -q E404; then tag="$latest"; fi
              fi
            fi
          fi
          if [ -z "$tag" ]; then
            echo "No sandbox-kubernetes-v* release on this commit and none missing on npm: nothing to publish."
            exit 0
          fi
          if [[ ! "$tag" =~ ^sandbox-kubernetes-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is not a sandbox-kubernetes-v<major>.<minor>.<patch> tag"
            exit 1
          fi
          released=$(git show "$tag:adapters/sandbox/kubernetes/package.json" | jq -r .version)
          if [ "$released" != "${tag#sandbox-kubernetes-v}" ]; then
            echo "::error::$tag has version $released in adapters/sandbox/kubernetes/package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  npm:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance (public repository only)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The three dots build its workspace dependencies first, if it ever has any.
      - run: pnpm --filter "@opensoftware/sandbox-kubernetes..." build
      # pnpm pack replaces workspace: versions with real ones.
      - run: pnpm --dir adapters/sandbox/kubernetes pack --pack-destination "$RUNNER_TEMP/npm"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.21.1
      - name: Publish
        env:
          # Only for the first version, before the trusted publisher exists; unset afterwards (adapters/sandbox/kubernetes/README.md#releases).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm accepts provenance only from public repositories; it turns on when this repository is public.
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          provenance=--provenance
          if [ "$PRIVATE" = "true" ]; then provenance=--no-provenance; fi
          npm publish "$RUNNER_TEMP"/npm/*.tgz --access public "$provenance"
