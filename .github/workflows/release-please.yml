# Independent releases per package from Conventional Commits (ADR 0005).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # start verify on the release pull requests

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Each release moves the pins of the Compose profile and the Helm chart with it (ADR 0095): osf profile-pins
      # writes the versions of the release pull request into compose.yaml and the chart, and PROFILE checks them.
      - name: Find the open release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.release.outputs.branch != ''
        with:
          ref: ${{ steps.release.outputs.branch }}
      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.branch != ''
      - uses: actions/setup-node@v5
        if: steps.release.outputs.branch != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Write the profile pins into the release pull request
        if: steps.release.outputs.branch != ''
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --silent run osf profile-pins
          git add deploy
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: move the profile pins to the release"
            git push origin "HEAD:$BRANCH"
          fi

      # A pull request that GITHUB_TOKEN opens or updates starts no pull_request run that can pass without a
      # person's approval. A workflow_dispatch run is the exception, so start verify for every open release pull
      # request after each push to main: also for the ones release-please left unchanged, since main moved under
      # them. The run uses verify.yml from main, because a release branch can carry an older one.
      - name: Run verify on the open release pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number --jq '.[].number'); do
            gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr="$pr"
          done
