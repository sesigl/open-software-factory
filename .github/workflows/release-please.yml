# Independent releases per package from Conventional Commits (ADR 0005).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # start verify on the release pull requests

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A pull request that GITHUB_TOKEN opens or updates starts no pull_request run that can pass without a
      # person's approval. A workflow_dispatch run is the exception, so start verify on every open release branch
      # after each push to main: also on the ones release-please left unchanged, since main moved under them.
      - name: Run verify on the open release pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName --jq '.[].headRefName'); do
            gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done
