# The agent that builds this repository, declared with factory-spec (ADR 0020). `make agents-sync` renders it.
version: 1
factory: open-software-factory
description: The coding agent of this repository, for every harness its contributors use.
providers:
  harness:
    claude-code: "^2"
    codex: "^1"
    opencode: "^1"
agents:
  developer:
    harness: claude-code
    model: routes/developer
    effort: medium
    prompt: ./AGENTS.md
    repositories: [sesigl/open-software-factory]
    # The Stop hook of Claude Code: the fast checks run before a turn with changed files ends (ADR 0168).
    stopCheck:
      command: make check-fast --quiet
    skills:
      - ./skills/implement-scenario
      - ./skills/fix-mutation-and-duplication
      - ./skills/keep-docs-evergreen
      - ./skills/new-module
      - ./skills/release-packages
      - ./skills/ship-pull-request
      - ./skills/use-postgres
      - ./skills/write-adr
      - ./skills/write-scenario
      - ./skills/write-system-test
